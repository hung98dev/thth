// Retryability class of a client-visible error
// (docs/05_network/errors.md § Retryability).
enum Retryability {
  RETRYABILITY_UNSPECIFIED = 0;
  RETRYABILITY_NEVER = 1;
  RETRYABILITY_RETRY_SAME_OPERATION = 2;
  RETRYABILITY_RECONNECT = 3;
  RETRYABILITY_UPDATE_REQUIRED = 4;
  RETRYABILITY_REAUTHENTICATE = 5;
  RETRYABILITY_BACKOFF = 6;
}

// ResultStatus is the common success/error status of typed operation results
// (protobuf_conventions.md §6).
enum ResultStatus {
  RESULT_STATUS_UNSPECIFIED = 0;
  RESULT_STATUS_SUCCESS = 1;
  RESULT_STATUS_ERROR = 2;
}

// OperationResult is embedded as field 1 of every *_RESULT payload
// (protobuf_conventions.md §6). operation_id echoes the request's stable
// client-generated idempotency UUID (16 bytes; empty when none).
message OperationResult {
  bytes operation_id = 1;
  ResultStatus status = 2;
  ErrorCode error_code = 3;
}

// ItemQuantity is an item-id + stack-count pair (consumed/granted lists).
message ItemQuantity {
  string item_id = 1;    // content ID
  uint32 quantity = 2;
}

// ItemGrant is a materialized item grant: the created/mutated instance plus
// its content identity and stack count.
message ItemGrant {
  bytes item_instance_id = 1;  // UUID, 16 bytes
  string item_id = 2;          // content ID
  uint32 quantity = 3;
}

// CurrencyDelta is a signed currency movement; amount is negative on spend.
message CurrencyDelta {
  string currency_id = 1;  // content ID (currency.common / currency.special / currency.premium)
  int64 amount = 2;
}

// PositionMm is an integer-millimetre world position
// (04_architecture/physics_geometry_contract.md).
message PositionMm {
  sint32 x_mm = 1;
  sint32 y_mm = 2;
}

// Facing — horizontal facing direction.
enum Facing {
  FACING_UNSPECIFIED = 0;
  FACING_LEFT = 1;
  FACING_RIGHT = 2;
}

// MovementState — locomotion state (01_gameplay/movement.md).
enum MovementState {
  MOVEMENT_STATE_UNSPECIFIED = 0;
  MOVEMENT_STATE_IDLE = 1;
  MOVEMENT_STATE_RUN = 2;
  MOVEMENT_STATE_JUMP = 3;
  MOVEMENT_STATE_FALL = 4;
  MOVEMENT_STATE_KNOCKBACK = 5;
}

// EntityKind — runtime entity classification (messages.md § Replication).
enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PLAYER = 1;
  ENTITY_KIND_MONSTER = 2;
  ENTITY_KIND_NPC = 3;
  ENTITY_KIND_BEAST = 4;
  ENTITY_KIND_OBJECT = 5;
  ENTITY_KIND_PROJECTILE = 6;
}

// EntityFlag — EntityState.flags bitmask values (bit N = 1 << value).
enum EntityFlag {
  ENTITY_FLAG_UNSPECIFIED = 0;
  ENTITY_FLAG_IN_COMBAT = 1;      // bit 0
  ENTITY_FLAG_DEAD = 2;           // bit 1
  ENTITY_FLAG_INVULNERABLE = 4;   // bit 2
  ENTITY_FLAG_INTERACTABLE = 8;   // bit 3
  ENTITY_FLAG_ELIGIBLE = 16;      // bit 4 — chest eligibility for this viewer
}

// OnlineState — presence flag shared by party/guild/friend views.
enum OnlineState {
  ONLINE_STATE_UNSPECIFIED = 0;
  ONLINE_STATE_ONLINE = 1;
  ONLINE_STATE_OFFLINE = 2;
}

