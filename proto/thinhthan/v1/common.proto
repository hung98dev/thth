  COSMETIC_SLOT_NAMEPLATE = 4;
  COSMETIC_SLOT_APPEARANCE = 5;
  COSMETIC_SLOT_WEAPON_TRAIL = 6;
  COSMETIC_SLOT_AURA = 7;
  COSMETIC_SLOT_CHARACTER_SHRINE = 8;
  COSMETIC_SLOT_GUILD_STONE_INSCRIPTION = 9;
}

// CharacterSummary — character-select row (messages.md ID 14).
message CharacterSummary {
  bytes character_id = 1;        // UUID, 16 bytes
  string character_name = 2;
  string class_id = 3;           // class.kim | class.moc | class.thuy | class.hoa | class.tho
  uint32 level = 4;
  string map_id = 5;             // content ID
  int64 last_online_at_ms = 6;   // Unix ms
  bool is_attached = 7;
}

// EntityStatusView — one active status effect inside EntityState.
message EntityStatusView {
  string effect_id = 1;            // content ID (01_gameplay/status_effects.md)
  uint64 source_entity_id = 2;     // runtime entity ID
  uint32 stacks = 3;
  uint64 expires_at_tick = 4;
}

// EquippedCosmetic — one equipped cosmetic inside EntityState.
message EquippedCosmetic {
  CosmeticSlot slot = 1;
  string cosmetic_id = 2;  // content ID
}

// EntityState — full entity state for baseline/spawn (messages.md
// § Replication). All runtime entity IDs are uint64 partition-scoped.
message EntityState {
  uint64 entity_id = 1;
  EntityKind entity_kind = 2;
  string content_id = 3;             // monster_id | npc_id | object ID | beast_id | projectile ID; class_id for PLAYER
  bytes character_id = 4;            // UUID, 16 bytes; PLAYER only
  string display_name = 5;
  uint32 level = 6;
  uint64 owner_entity_id = 7;        // BEAST/PROJECTILE; 0 = none
  sint32 x_mm = 8;
  sint32 y_mm = 9;
  sint32 vx_mm_s = 10;
  sint32 vy_mm_s = 11;
  Facing facing = 12;
  MovementState movement_state = 13;
  int64 hp = 14;
  int64 max_hp = 15;
  int64 shield = 16;
  uint32 flags = 17;                                // EntityFlag bitmask
  repeated EntityStatusView statuses = 18;
  repeated EquippedCosmetic equipped_cosmetics = 19; // PLAYER only
  uint64 encounter_id = 20;                          // 0 = none
  uint32 stat_lifesteal = 21;                        // basis points (ADR-0037)
  uint32 stat_reflect = 22;
  uint32 stat_absorb = 23;
  uint32 stat_heal_reduction = 24;
  uint32 stat_healing_received = 25;
}

// RewardSourceType — reward claim provenance
// (03_systems/reward_claims.md § Claim Creation).
enum RewardSourceType {
  REWARD_SOURCE_TYPE_UNSPECIFIED = 0;
  REWARD_SOURCE_TYPE_MONSTER = 1;
  REWARD_SOURCE_TYPE_BOSS = 2;
  REWARD_SOURCE_TYPE_BOSS_CHEST = 3;
  REWARD_SOURCE_TYPE_DUNGEON = 4;
  REWARD_SOURCE_TYPE_QUEST = 5;
  REWARD_SOURCE_TYPE_WORLD_EVENT = 6;
  REWARD_SOURCE_TYPE_ATLAS = 7;
  REWARD_SOURCE_TYPE_FEAT = 8;
  REWARD_SOURCE_TYPE_LEVEL_MILESTONE = 9;
  REWARD_SOURCE_TYPE_PVP = 10;
  REWARD_SOURCE_TYPE_GUILD_WAR = 11;
  REWARD_SOURCE_TYPE_GUILD = 12;
  REWARD_SOURCE_TYPE_AUCTION_ESCROW_EXPIRY = 13;
  REWARD_SOURCE_TYPE_ADMIN_COMPENSATION = 14;
}

// RewardClaimState — claim lifecycle
// (PENDING -> CLAIMING -> CLAIMED; PENDING -> EXPIRED).
enum RewardClaimState {
  REWARD_CLAIM_STATE_UNSPECIFIED = 0;
  REWARD_CLAIM_STATE_PENDING = 1;
  REWARD_CLAIM_STATE_CLAIMING = 2;
  REWARD_CLAIM_STATE_CLAIMED = 3;
  REWARD_CLAIM_STATE_EXPIRED = 4;
}

// RewardClaimLine — one claimable line of a reward claim; exactly one of
// item_id / currency_id is set.
message RewardClaimLine {
  oneof ref {
    string item_id = 1;
    string currency_id = 2;
  }
  uint32 quantity = 3;
}

// RewardClaimView — paged view of one reward claim (messages.md ID 434).
message RewardClaimView {
  bytes reward_claim_id = 1;              // UUID, 16 bytes
  RewardSourceType source_type = 2;
  string source_reference = 3;            // source row reference
  string reward_slot = 4;                 // stable slot ID within the source bundle
  RewardClaimState state = 5;
  repeated RewardClaimLine lines = 6;
  int64 created_at_ms = 7;                // Unix ms
  int64 expires_at_ms = 8;                // Unix ms; 0 = no expiry
}
