// Thỉnh Thần wire contract — shared types, canonical envelope, message registry.
// Source of truth for the wire; generated outputs live in
// server/internal/protocol/v1/ and client/Assets/Scripts/Protocol/ and are
// never hand-edited (docs/05_network/protobuf_conventions.md).
syntax = "proto3";

package thinhthan.v1;

option go_package = "thinhthan/internal/protocol/v1;protocolv1";
option csharp_namespace = "ThinhThan.Protocol.V1";

// Envelope is the single wire frame inside one WebSocket binary message
// (docs/05_network/protobuf_conventions.md §2).
message Envelope {
  uint32 protocol_major = 1;  // protocol major version
  uint32 protocol_minor = 2;  // protocol minor version
  uint32 message_id = 3;      // a MessageId value; registry docs/05_network/messages.md
  uint64 session_epoch = 4;   // session generation issued by S2C_HELLO_OK
  uint64 client_seq = 5;      // per-session monotonic client sequence
  uint64 server_seq = 6;      // per-session monotonic server sequence
  uint64 correlation_id = 7;  // correlates a result with the request client_seq
  bytes payload = 8;          // serialized message body for message_id
}

