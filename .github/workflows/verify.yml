      # IMP-106: explicit cache steps (policy: .devin/scripts/cache-policy.md).
      # Keys = <scope>-<os>-<pin>-<content hash>; restore-keys keep OS+pin and
      # may only roll the hash on content-addressed stores. Caches whose
      # payload derives from the hashed inputs restore on exact key only
      # (CI-001, BLK-005). Licence state is never cached (CI-002).
      - name: Cache Go modules + build (pinned)
        id: cache-go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/AppData/Local/go-build
          key: go-build-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('server/go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Install protoc + Go tool binaries (pinned)
        shell: pwsh
        env:
          CACHE_HIT_GO: ${{ steps.cache-go.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          . .\.devin\scripts\cache_telemetry.ps1
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $T = "$env:RUNNER_TEMP\tools"
          New-Item -ItemType Directory -Force -Path "$T\gobin","$T\protoc" | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-win64.zip' -OutFile "$env:TEMP\protoc.zip" -UseBasicParsing
          Expand-Archive "$env:TEMP\protoc.zip" -DestinationPath "$T\protoc" -Force
          $env:GOBIN = "$T\gobin"
