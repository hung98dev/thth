          } else {
            $z = "$env:RUNNER_TEMP\edb.zip"
            curl.exe -fSL -m 900 --retry 3 --retry-delay 10 'https://get.enterprisedb.com/postgresql/postgresql-18.6-1-windows-x64-binaries.zip' -o $z
            if ($LASTEXITCODE -ne 0) { throw "edb download failed rc=$LASTEXITCODE" }
            Write-Host 'edb download done'
            if ((Get-FileHash $z -Algorithm SHA256).Hash.ToLower() -ne $edbSha) { throw 'edb sha256 mismatch' }
            Write-Host 'edb sha256 ok'
            New-Item -ItemType Directory -Force -Path $cacheRoot | Out-Null
            tar.exe -xf $z -C $cacheRoot
            if (-not (Test-Path "$bin\initdb.exe")) { $bin = "$cacheRoot\bin" }
            Set-Content -Path $marker -Value $edbSha -NoNewline
            Write-Host "edb extract done; bin=$bin"
          }
          Write-CacheTelemetry -Step 'edb-postgres' -Result $(if ($hit) { 'hit' } else { 'miss' }) -WallSeconds $sw.Elapsed.TotalSeconds
          $p = Start-Process -FilePath "$bin\initdb.exe" -ArgumentList "-D `"$env:RUNNER_TEMP\pgdata`" -U postgres -A trust -E UTF8 --locale=C" -NoNewWindow -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\initdb.out" -RedirectStandardError "$env:RUNNER_TEMP\initdb.err"
          if (-not $p.WaitForExit(300000)) { $p | Stop-Process -Force; throw 'initdb timed out after 300s' }
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\initdb.err" -Tail 40 -ErrorAction SilentlyContinue; throw "initdb failed rc=$($p.ExitCode)" }
          Write-Host 'initdb done'
          $l = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $l.Start(); $port = $l.LocalEndpoint.Port; $l.Stop()
          $p = Start-Process -FilePath "$bin\pg_ctl.exe" -ArgumentList "-D `"$env:RUNNER_TEMP\pgdata`" -o `"-p $port`" -l `"$env:RUNNER_TEMP\pg.log`" -w -t 120 start" -NoNewWindow -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\pgctl.out" -RedirectStandardError "$env:RUNNER_TEMP\pgctl.err"
          if (-not $p.WaitForExit(180000)) { $p | Stop-Process -Force; Get-Content "$env:RUNNER_TEMP\pg.log" -Tail 40 -ErrorAction SilentlyContinue; throw 'pg_ctl timed out after 180s' }
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\pg.log" -Tail 40 -ErrorAction SilentlyContinue; throw "pg_ctl failed rc=$($p.ExitCode)" }
          Write-Host 'postgres started'
          "THINHTHAN_TEST_PG_DSN=postgres://postgres@127.0.0.1:$port/postgres?sslmode=disable" >> $env:GITHUB_ENV

      - name: Verifier environment
        shell: pwsh
        run: |
          @(
            "THINHTHAN_BASE_SHA=${{ github.event.pull_request.base.sha }}",
            "THINHTHAN_HEAD_SHA=${{ github.event.pull_request.head.sha }}",
            "THINHTHAN_RUN_ID=${{ github.run_id }}",
            "THINHTHAN_RUN_ATTEMPT=${{ github.run_attempt }}"
          ) -join "`n" >> $env:GITHUB_ENV

      - name: Unity scope
        id: unity-scope
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # ADR-0073: a pull_request whose diff touches no Unity-relevant path
          # skips the Unity steps; the verifier re-derives the diff and fails
          # an illegitimate skip. Pattern == gates.UnityRelevantPattern.
          $pattern = '^(client/|proto/|scripts/codegen\.|scripts/verify\.ps1$|\.github/workflows/|server/cmd/verify/|server/internal/conformance/|docs/00_context/technology_versions\.md$)'
          $run = 'true'; $scope = 'full'
          $full = $env:HEAD_REF.StartsWith('imp/IMP-068-') -or $env:HEAD_REF.EndsWith('-done')
          if ($env:EVENT_NAME -like 'pull_request*' -and -not $full) {
            $files = @(git diff --name-only "$env:BASE_SHA...$env:HEAD_SHA")
            if ($LASTEXITCODE -eq 0 -and -not ($files | Where-Object { $_ -match $pattern })) {
              $run = 'false'; $scope = 'no-client-change'
            }
          }
          Write-Host "unity scope: $scope"
          "run=$run" >> $env:GITHUB_OUTPUT
          "THINHTHAN_UNITY_SCOPE=$scope" >> $env:GITHUB_ENV

      # ADR-0073: the Windows job runs the editor natively. The GameCI Windows
      # image (>10 GB) never fit the repository cache, so every run paid a
      # 16-17 min pull plus a failed 6-10 min cache save.
      - name: Unity editor path
        shell: pwsh
        # The Unity job installs the pinned editor here (ADR-0073); the
        # verifier's Q1 records the pinned path.
        run: '"UNITY_EDITOR_PATH=$env:RUNNER_TEMP\unity-editor\Editor\Unity.exe" >> $env:GITHUB_ENV'

      - name: Wait for Unity job
        id: unity-wait
        if: steps.unity-scope.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAIT_JOB: 'Unity (Windows)'
        run: bash .devin/scripts/wait_job.sh

      - name: Download Unity test results
        if: steps.unity-scope.outputs.run == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unity-test-results-windows
          path: artifacts/unity-tests

      - name: Merge Unity cache telemetry
        if: steps.unity-scope.outputs.run == 'true'
        shell: pwsh
        run: |
          $f = 'artifacts/unity-tests/cache-telemetry.jsonl'
          if (Test-Path $f) {
            Get-Content $f | Add-Content (Join-Path $env:RUNNER_TEMP 'cache-telemetry.jsonl')
            Remove-Item $f
          }

      - name: Run Q0-Q6 verifier
        # BLK-017: always produce verify-report.json once the tree is checked out
        # (a failed Unity step is recorded as a Q3 FAIL, never a missing report).
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THINHTHAN_CACHE_HIT_GO: ${{ steps.cache-go.outputs.cache-hit }}
        run: pwsh -NoProfile -File scripts/verify.ps1 -UnityResultsDir artifacts/unity-tests -ReportOut verify-report.json

      - name: Unity job result
        if: ${{ !cancelled() && steps.unity-scope.outputs.run == 'true' }}
        shell: bash
        env:
          CONCLUSION: ${{ steps.unity-wait.outputs.conclusion }}
        run: |
          # ADR-0075: a failed Unity job (materialization drift, licence,
          # editor crash) fails this required check even when every Unity gate
          # reports SKIP(owner-not-done).
          if [ "$CONCLUSION" != success ]; then
            echo "Unity (Windows) job concluded '$CONCLUSION' - see its log; on drift commit artifact unity-materialized-windows (agent_execution_protocol.md §4b)" >&2
            exit 1
          fi

      - name: Upload verify report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-report-windows
          path: verify-report.json
          if-no-files-found: error

