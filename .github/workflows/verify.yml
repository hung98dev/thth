            if ($LASTEXITCODE -ne 0) { throw "unity installer download failed rc=$LASTEXITCODE" }
            if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() -ne $env:UNITY_WINDOWS_EDITOR_SHA256) { throw 'unity installer sha256 mismatch' }
            # NSIS silent install: /D must be last and unquoted.
            $p = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$dir" -PassThru -Wait
            if ($p.ExitCode -ne 0 -or -not (Test-Path $exe)) { throw "unity install failed rc=$($p.ExitCode)" }
            Remove-Item $setup -Force
            Set-Content -Path $marker -Value $env:UNITY_WINDOWS_EDITOR_SHA256 -NoNewline
          }
          "UNITY_EDITOR_PATH=$exe" >> $env:GITHUB_ENV
          Write-CacheTelemetry -Step 'unity-editor-image' -Result $(if ($hit) { 'hit' } else { 'miss' }) -WallSeconds $sw.Elapsed.TotalSeconds

      - name: Cache Unity client/Library (pinned)
        id: cache-unity-library
        if: steps.unity-scope.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # exact key only (CI-001): a prefix restore returns a Library built
          # from different manifest/lock/ProjectSettings inputs — a silent
          # wrong-content restore (BLK-005). A miss = cold import.
          path: client/Library
          key: unity-library-${{ runner.os }}-${{ env.UNITY_WINDOWS_EDITOR_SHA256 }}-${{ hashFiles('client/Packages/manifest.json', 'client/Packages/packages-lock.json', 'client/ProjectSettings/**', 'client/Assets/**/csc.rsp') }}

      - name: Unity materialization (licence retry <=5)
        if: steps.unity-scope.outputs.run == 'true'
        timeout-minutes: 30
        shell: pwsh
        env:
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          CACHE_HIT_LIBRARY: ${{ steps.cache-unity-library.outputs.cache-hit }}
        run: |
          . .\.devin\scripts\cache_telemetry.ps1
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $libHit = if ($env:CACHE_HIT_LIBRARY -eq 'true') { 'hit' } else { 'miss' }
          $ulf = 'C:\ProgramData\Unity\Unity_lic.ulf'
          $logPath = "$env:RUNNER_TEMP\unity-materialize.log"
          $proj = "$env:GITHUB_WORKSPACE\client"
          $ok = $false
          foreach ($i in 1..5) {
            Remove-Item $logPath -Force -ErrorAction SilentlyContinue
            $uargs = @('-batchmode', '-nographics', '-projectPath', $proj, '-quit', '-logFile', $logPath)
            if (-not (Test-Path $ulf)) {
              $uargs += @('-serial', "$env:UNITY_SERIAL", '-username', "$env:UNITY_EMAIL", '-password', "$env:UNITY_PASSWORD")
            }
            $p = Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $uargs -PassThru -Wait -NoNewWindow
            $rc = $p.ExitCode
            $log = ''
            if (Test-Path $logPath) {
              $log = Get-Content $logPath -Raw
              Get-Content $logPath -Tail 60
            }
            if ($log -match 'Exiting batchmode successfully' -and $log -notmatch 'Scripts have compiler errors' -and (Test-Path "$proj\Library\PackageCache")) { $ok = $true; break }
            if ($log -match 'license|licence' -and $log -match 'fail|error|invalid') { Remove-Item $ulf -Force -ErrorAction SilentlyContinue }
            if ($rc -eq 198) { Write-CacheTelemetry -Step 'unity-library' -Result $libHit -WallSeconds $sw.Elapsed.TotalSeconds; Write-Host "unity licence activation failed deterministically (rc=$rc) - not retrying"; exit 1 }
            Write-Host "unity materialization attempt $i failed (rc=$rc); retrying after 60s"
            if ($i -lt 5 -and $log -notmatch 'Scripts have compiler errors') { Start-Sleep -Seconds 60 }
          }
          Write-CacheTelemetry -Step 'unity-library' -Result $libHit -WallSeconds $sw.Elapsed.TotalSeconds
          if (-not $ok) { Write-Error 'unity materialization failed after 5 attempts (licence/infra)'; exit 1 }

      - name: Unity EditMode+PlayMode tests
        if: steps.unity-scope.outputs.run == 'true' && steps.unity-plan.outputs.modes != ''
        timeout-minutes: 30
        shell: pwsh
        env:
          UNITY_MODES: ${{ steps.unity-plan.outputs.modes }}
        run: |
          $proj = "$env:GITHUB_WORKSPACE\client"
          $out = "$env:GITHUB_WORKSPACE\artifacts\unity-tests"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($mode in ($env:UNITY_MODES -split ' ')) {
            $xml = "$out\$mode-results.xml"
            $log = "$env:RUNNER_TEMP\unity-tests-$mode.log"
            # Retry only when Unity produced no results XML (crash/licence/
            # infra); a results file — pass or fail — is final and judged by
            # the verifier (Q3).
            foreach ($i in 1..3) {
              Remove-Item $xml, $log -Force -ErrorAction SilentlyContinue
              $uargs = @('-batchmode', '-nographics', '-projectPath', $proj, '-runTests', '-testPlatform', $mode, '-testResults', $xml, '-logFile', $log)
              $p = Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $uargs -PassThru -Wait -NoNewWindow
              if (Test-Path $log) { Get-Content $log -Tail 80 }
              if (Test-Path $xml) { Write-Host "unity $mode tests finished (rc=$($p.ExitCode))"; break }
              Write-Host "unity $mode attempt $i produced no results (rc=$($p.ExitCode)); retrying after 20s"
              Start-Sleep -Seconds 20
            }
            if (-not (Test-Path $xml)) { Write-Error "unity $mode tests produced no results after 3 attempts"; exit 1 }
          }

      - name: Return Unity licence
        if: always() && steps.unity-scope.outputs.run == 'true'
        shell: pwsh
        env:
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        run: |
          if (-not $env:UNITY_EDITOR_PATH -or -not (Test-Path 'C:\ProgramData\Unity\Unity_lic.ulf')) { Write-Host 'no activated licence to return'; exit 0 }
          # Bounded: the editor lingers ~10 min after the return request on
          # hosted runners; the runner VM is discarded anyway.
          $p = Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList @('-batchmode', '-nographics', '-quit', '-returnlicense', '-username', "$env:UNITY_EMAIL", '-password', "$env:UNITY_PASSWORD", '-logFile', "$env:RUNNER_TEMP\unity-return.log") -PassThru -NoNewWindow
          if ($p.WaitForExit(90000)) { Write-Host "licence return rc=$($p.ExitCode)" }
          else {
            Get-Content "$env:RUNNER_TEMP\unity-return.log" -Tail 20 -ErrorAction SilentlyContinue
            $p | Stop-Process -Force -ErrorAction SilentlyContinue
            Write-Host 'licence return still running after 90s - stopped'
          }
          exit 0

      - name: Unity materialized drift check
        id: drift
        shell: pwsh
        run: |
          $drift = git -C $env:GITHUB_WORKSPACE status --porcelain -- client/ |
            Where-Object { $_ -notmatch 'client/(Library|Temp|Logs|obj)/' }
          if ($drift) {
            $stage = 'materialized-drift'
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            foreach ($line in $drift) {
              $p = $line.Substring(3).Trim('"')
              if (Test-Path $p -PathType Leaf) {
                $dst = Join-Path $stage $p
                New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
                Copy-Item $p $dst
              }
            }
            $drift | Out-Host
            'changed=true' >> $env:GITHUB_OUTPUT
            Write-Error 'commit unity-materialized'
            exit 1
          }
          'changed=false' >> $env:GITHUB_OUTPUT

      - name: Stage cache telemetry
        # ADR-0075: the Unity job's cached-step telemetry rides on the results
        # artifact so the required job folds it into verify-report.json.
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/unity-tests | Out-Null
          $t = Join-Path $env:RUNNER_TEMP 'cache-telemetry.jsonl'
          if (Test-Path $t) { Copy-Item $t artifacts/unity-tests/cache-telemetry.jsonl }

      - name: Upload unity-materialized drift
        if: always() && steps.drift.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unity-materialized-windows
          path: materialized-drift/
          if-no-files-found: ignore

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unity-test-results-windows
          path: artifacts/unity-tests/
          if-no-files-found: ignore


  verify-windows:
    name: 'Q0-Q6 verify (Windows)'
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Fork guard
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        shell: cmd
        run: |
          if /I "${{ github.event.pull_request.head.repo.fork }}"=="true" (echo external PRs not accepted >&2 & exit /b 1)
          if /I not "${{ github.event.pull_request.head.repo.full_name }}"=="${{ github.repository }}" (echo external PRs not accepted >&2 & exit /b 1)

      - name: Merge freeze guard
        shell: cmd
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          echo %BRANCH_NAME%| findstr /b /c:"revert/" /c:"ops/" >nul && (echo exempt branch & exit /b 0)
          if /I "${{ vars.AUTO_MERGE_FROZEN }}"=="true" (echo repository merge freeze active >&2 & exit /b 1)
          exit /b 0

      # ADR-0073: pinned CLI installs are cached by their pinned version+sha
      # set; the install step re-asserts the pin marker on every run (CI-001)
      # and always runs (CI-002) — a hit only skips the downloads.
      - name: Cache pinned CLI tools
        id: cache-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
