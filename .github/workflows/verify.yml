name: verify

# Canonical Q0-Q6 gate run (IMP-000). pull_request only until the
# pull_request_target cutover (IMP-068); no workflow_dispatch, no merge queue.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PWSH_VERSION: '7.6.6'
  GO_VERSION: '1.27.1'
  PROTOC_VERSION: '36.2'
  PROTOC_GEN_GO_VERSION: 'v1.36.12'
  STATICCHECK_VERSION: 'v0.8.1'
  UNITY_LINUX_IMAGE: 'unityci/editor:ubuntu-6000.6.1f1-base-3.2.2@sha256:2197a718c75ba71d6d9a05cfdfbce31cc401113f530963ac789160dffc96763d'
  # Container runs use the tag form of the pinned Linux image (IMP-106).
  UNITY_LINUX_IMAGE_TAG: 'unityci/editor:ubuntu-6000.6.1f1-base-3.2.2'
  # Cache-key pins: digest of the unityci image, the native Windows editor
  # installer sha256 and the EDB zip sha256 — kept equal to the pins they
  # mirror by conformance/caching tests.
  UNITY_LINUX_IMAGE_DIGEST: 'sha256:2197a718c75ba71d6d9a05cfdfbce31cc401113f530963ac789160dffc96763d'
  # Windows runs the Unity editor natively (ADR-0073): pinned official
  # installer, silent install into runner.temp/unity-editor, dir cached.
  UNITY_WINDOWS_EDITOR_URL: 'https://download.unity3d.com/download_unity/7efac9f6c10e/Windows64EditorInstaller/UnitySetup64-6000.6.1f1.exe'
  UNITY_WINDOWS_EDITOR_SHA256: '8884daa489c8708c17da571c46a869839dd7bbf45f69048bd4db5c6d054d5e36'
  EDB_ZIP_SHA256: 'fbe23da234ee31547bf8a36d29dfd81e82b849df2d2b78d2eecb43d360252f8c'
  POSTGRES_IMAGE: 'postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722'

jobs:
  # ADR-0075: Unity runs in its own job, in parallel with the Go/PostgreSQL
  # work of the required job; `Q0-Q6 verify (Linux)` waits for it and judges
  # its results. Not a required check itself — never gate on this job name.
  unity-linux:
    name: 'Unity (Linux)'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Fork guard
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        shell: bash
        run: |
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ] || \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "external PRs not accepted" >&2
            exit 1
          fi

      - name: Merge freeze guard
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$BRANCH_NAME" in
            revert/*|ops/*) echo "exempt branch"; exit 0 ;;
          esac
          if [ "${{ vars.AUTO_MERGE_FROZEN }}" = "true" ]; then
            echo "repository merge freeze active (AUTO_MERGE_FROZEN)" >&2
            exit 1
          fi

      # ADR-0077: the digest-pinned image pull (~80-100 s) runs in the
      # background while the toolchain, checkout and caches are set up;
      # `Pull Unity image (pinned)` joins it. No secret is involved.
      - name: Start Unity image pull (background)
        shell: bash
        env:
          UNITY_IMAGE: ${{ env.UNITY_LINUX_IMAGE }}
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/unity-docker-pull.rc"
          nohup bash -c 'docker pull "$1" > "$2" 2>&1; echo $? > "$3"' _ \
            "$UNITY_IMAGE" "$RUNNER_TEMP/unity-docker-pull.log" "$RUNNER_TEMP/unity-docker-pull.rc" \
            > /dev/null 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/unity-docker-pull.pid"
          echo "background pull started (pid $(cat "$RUNNER_TEMP/unity-docker-pull.pid"))"

      # -- Toolchain bootstrap (pinned release assets, SHA-256 verified; the
      #    runner's preinstalled tools are never used) ---------------------
      - name: Install pwsh (pinned)
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/tools"; mkdir -p "$T"
          curl -fsSL "https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/powershell-7.6.6-linux-x64.tar.gz" -o /tmp/pwsh.tgz
          echo "ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc  /tmp/pwsh.tgz" | sha256sum -c -
          mkdir -p "$T/pwsh" && tar -xzf /tmp/pwsh.tgz -C "$T/pwsh" && chmod +x "$T/pwsh/pwsh"
          echo "$T/pwsh" >> "$GITHUB_PATH"

      - name: Install jq / gh / git-lfs (pinned)
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/tools"; mkdir -p "$T/bin"
          curl -fsSL "https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64" -o "$T/bin/jq"
          echo "b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f  $T/bin/jq" | sha256sum -c -
          chmod +x "$T/bin/jq"
          curl -fsSL "https://github.com/cli/cli/releases/download/v2.101.0/gh_2.101.0_linux_amd64.tar.gz" -o /tmp/gh.tgz
          echo "9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8  /tmp/gh.tgz" | sha256sum -c -
          tar -xzf /tmp/gh.tgz -C /tmp && cp /tmp/gh_2.101.0_linux_amd64/bin/gh "$T/bin/gh"
          curl -fsSL "https://github.com/git-lfs/git-lfs/releases/download/v3.8.0/git-lfs-linux-amd64-v3.8.0.tar.gz" -o /tmp/lfs.tgz
          echo "e455e00f15d9b95661b8d53498ffb0c3367962cf1ec73c31ab7369516cd6ab8d  /tmp/lfs.tgz" | sha256sum -c -
          tar -xzf /tmp/lfs.tgz -C /tmp && cp /tmp/git-lfs-3.8.0/git-lfs "$T/bin/git-lfs"
          echo "$T/bin" >> "$GITHUB_PATH"
          git lfs install --skip-repo || true

      - name: Install Go (pinned)
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.27.1'
          cache: false

      - name: Checkout (LFS)
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          fetch-depth: 0

      # IMP-106: explicit cache steps (policy: .devin/scripts/cache-policy.md).
      # Keys = <scope>-<os>-<pin>-<content hash>; restore-keys keep OS+pin and
      # may only roll the hash on content-addressed stores. Caches whose
      # payload derives from the hashed inputs restore on exact key only
      # (CI-001, BLK-005). Licence state is never cached (CI-002).
      - name: Cache Go modules + build (pinned)
        id: cache-go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('server/go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Unity scope
        id: unity-scope
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # ADR-0073: a pull_request whose diff touches no Unity-relevant path
          # skips the Unity steps; the verifier re-derives the diff and fails
          # an illegitimate skip. Pattern == gates.UnityRelevantPattern.
          $pattern = '^(client/|proto/|scripts/codegen\.|scripts/verify\.ps1$|\.github/workflows/|server/cmd/verify/|server/internal/conformance/|docs/00_context/technology_versions\.md$)'
          $run = 'true'; $scope = 'full'
          $full = $env:HEAD_REF.StartsWith('imp/IMP-068-') -or $env:HEAD_REF.EndsWith('-done')
          if ($env:EVENT_NAME -like 'pull_request*' -and -not $full) {
            $files = @(git diff --name-only "$env:BASE_SHA...$env:HEAD_SHA")
            if ($LASTEXITCODE -eq 0 -and -not ($files | Where-Object { $_ -match $pattern })) {
              $run = 'false'; $scope = 'no-client-change'
            }
          }
          Write-Host "unity scope: $scope"
          "run=$run" >> $env:GITHUB_OUTPUT
          "THINHTHAN_UNITY_SCOPE=$scope" >> $env:GITHUB_ENV

      - name: Unity mode plan
        id: unity-plan
        if: steps.unity-scope.outputs.run == 'true'
        shell: bash
        env:
          THINHTHAN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          THINHTHAN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # ADR-0075: launch only the Unity test modes whose Q3 gate is active
          # (owner DONE on main or in the head; not a status-only PR). The
          # verifier computes the plan from the same activation it gates with.
          go -C server run ./cmd/verify -plan-unity | tee -a "$GITHUB_OUTPUT"

      - name: Cache Unity client/Library (pinned)
        id: cache-unity-library
        if: steps.unity-scope.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # exact key only (CI-001): a prefix restore returns a Library built
          # from different manifest/lock/ProjectSettings inputs — a silent
          # wrong-content restore (BLK-005). A miss = cold import.
          path: client/Library
          key: unity-library-${{ runner.os }}-${{ env.UNITY_LINUX_IMAGE_DIGEST }}-${{ hashFiles('client/Packages/manifest.json', 'client/Packages/packages-lock.json', 'client/ProjectSettings/**', 'client/Assets/**/csc.rsp') }}

      - name: Pull Unity image (pinned)
        if: steps.unity-scope.outputs.run == 'true'
        timeout-minutes: 20
        shell: bash
        env:
          UNITY_IMAGE: ${{ env.UNITY_LINUX_IMAGE }}
          UNITY_IMAGE_TAG: ${{ env.UNITY_LINUX_IMAGE_TAG }}
        run: |
          set -euo pipefail
          source .devin/scripts/cache_telemetry.sh
          start=$SECONDS
          # ADR-0073: no actions/cache for the image — a docker pull on the
          # hosted Linux runner is ~2 min and the tar would eat the 10 GB
          # repository cache budget the Windows editor cache needs.
          # ADR-0077: join the background pull; any failure of it falls back
          # to a foreground pull of the same digest.
          pid=$(cat "$RUNNER_TEMP/unity-docker-pull.pid" 2>/dev/null || true)
          if [ -n "$pid" ]; then
            while kill -0 "$pid" 2>/dev/null; do sleep 1; done
          fi
          rc=$(cat "$RUNNER_TEMP/unity-docker-pull.rc" 2>/dev/null || echo missing)
          tail -5 "$RUNNER_TEMP/unity-docker-pull.log" 2>/dev/null || true
          if [ "$rc" != 0 ]; then
            echo "background pull rc=$rc - pulling in the foreground"
            docker pull "$UNITY_IMAGE"
          fi
          docker tag "$(docker image inspect -f '{{.Id}}' "$UNITY_IMAGE")" "$UNITY_IMAGE_TAG"
          docker image inspect "$UNITY_IMAGE_TAG" >/dev/null
          cache_telemetry_emit unity-editor-image miss "$((SECONDS-start))"

      # ADR-0077: the kill-probe is an investigation tool (BLK-008..017), not a
      # gate; it runs only while the repository variable UNITY_KILL_PROBE is
      # 'true'.
      - name: Arm kill-probe (SIGKILL sender diagnostic)
        if: steps.unity-scope.outputs.run == 'true' && vars.UNITY_KILL_PROBE == 'true'
        shell: bash
        run: |
          if ! command -v auditctl >/dev/null 2>&1; then
            sudo apt-get update -qq >/dev/null 2>&1 || true
            sudo apt-get install -y -qq auditd >/dev/null 2>&1 || true
          fi
          sudo auditctl -D 2>/dev/null || true
          sudo auditctl -a always,exit -F arch=b64 -S kill -S tkill -S tgkill -S pidfd_send_signal -k unitykill 2>/dev/null || echo 'auditctl kill rules not installed'
          sudo auditctl -a always,exit -F arch=b64 -S exit_group -S exit -k exits 2>/dev/null || echo 'auditctl exit rules not installed'
          sudo auditctl -l 2>/dev/null || true
          (docker events --since "$(date +%s)" --filter 'event=die' --filter 'event=kill' --filter 'event=oom' --format '{{json .}}' > "$RUNNER_TEMP/docker-events.log" 2>&1 & echo $! > "$RUNNER_TEMP/docker-events.pid") || true
          # Stream the full trace_pipe to a file: signal_generate/deliver and
          # sched_process_exit land there with sender comm/pid — a tail of the
          # ring buffer misses senders outside the tail window (IMP-106).
          sudo env RUNNER_TEMP="$RUNNER_TEMP" bash -c '
            mount -t tracefs nodev /sys/kernel/tracing 2>/dev/null || true
            T=/sys/kernel/tracing; [ -d "$T/events" ] || T=/sys/kernel/debug/tracing
            if [ -d "$T/events/signal/signal_generate" ]; then
              : > "$T/trace" 2>/dev/null || true
              : > "$T/events/signal/signal_generate/filter" 2>/dev/null || true
              echo 1 > "$T/events/signal/signal_generate/enable" 2>/dev/null || true
              [ -d "$T/events/signal/signal_deliver" ] && : > "$T/events/signal/signal_deliver/filter" 2>/dev/null || true
              [ -d "$T/events/signal/signal_deliver" ] && echo 1 > "$T/events/signal/signal_deliver/enable" 2>/dev/null || true
              [ -d "$T/events/sched/sched_process_exit" ] && echo 1 > "$T/events/sched/sched_process_exit/enable" 2>/dev/null || true
              echo "$T" > /tmp/tracefs-dir
              cat "$T/trace_pipe" >> "$RUNNER_TEMP/trace-pipe.log" 2>/dev/null &
              echo $! > "$RUNNER_TEMP/trace-pipe.pid"
            fi
          ' || true
          if ! command -v bpftrace >/dev/null 2>&1; then
            sudo apt-get install -y -qq bpftrace >/dev/null 2>&1 || true
          fi
          mkdir -p "$RUNNER_TEMP/unity-cfg"
          if command -v bpftrace >/dev/null 2>&1; then
            (sudo bpftrace -e 'kprobe:cgroup_kill { printf("cgroup_kill writer comm=%s pid=%d\n", comm, pid); }' > "$RUNNER_TEMP/cgroup-kill.log" 2>&1 & echo $! > "$RUNNER_TEMP/bpftrace.pid") || true
          fi

      # DIAG-ONLY (diag/unity-self-kill): deep per-container probes. Temporary
      # instrumentation on this draft branch — never merge to main.
      - name: Arm diag probes (investigation-only)
        if: steps.unity-scope.outputs.run == 'true'
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/diag" "$RUNNER_TEMP/diag-out" "$RUNNER_TEMP/diag-run" artifacts/unity-diag
          sudo apt-get install -y -qq strace build-essential binutils >/dev/null 2>&1 || sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y -qq strace build-essential binutils >/dev/null 2>&1 || true
          command -v strace; command -v gcc; command -v strings
          cat > "$RUNNER_TEMP/diag/killshim.c" <<'EOF'
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <dlfcn.h>
          #include <execinfo.h>
          #include <fcntl.h>
          #include <signal.h>
          #include <time.h>
          #include <dirent.h>
          #include <sys/syscall.h>
          #include <sys/types.h>
          #include <sys/stat.h>
          #include <sys/uio.h>
          #include <sys/socket.h>
          static int (*r_kill)(pid_t,int);
          static int (*r_killpg)(pid_t,int);
          static int (*r_tkill)(pid_t,int);
          static int (*r_tgkill)(pid_t,pid_t,int);
          static ssize_t (*r_write)(int,const void*,size_t);
          static ssize_t (*r_writev)(int,const struct iovec*,int);
          static ssize_t (*r_send)(int,const void*,size_t,int);
          static ssize_t (*r_sendto)(int,const void*,size_t,int,const struct sockaddr*,socklen_t);
          static ssize_t (*r_sendmsg)(int,const struct msghdr*,int);
          static int (*r__exit)(int);
          static void (*r_exit)(int);
          static void (*r_abort)(void);
          static __thread int in_hook;
          static __thread int io_fd = -1;
          static int exe_state = 0; /* 1 unchecked, 2 editor, 3 other */
          static void res(void){
            if(!r_kill){r_kill=dlsym(RTLD_NEXT,"kill");r_killpg=dlsym(RTLD_NEXT,"killpg");
            r_tkill=dlsym(RTLD_NEXT,"tkill");r_tgkill=dlsym(RTLD_NEXT,"tgkill");
            r_write=dlsym(RTLD_NEXT,"write");r_writev=dlsym(RTLD_NEXT,"writev");
            r_send=dlsym(RTLD_NEXT,"send");r_sendto=dlsym(RTLD_NEXT,"sendto");r_sendmsg=dlsym(RTLD_NEXT,"sendmsg");
            r_exit=dlsym(RTLD_NEXT,"exit");r_abort=dlsym(RTLD_NEXT,"abort");r__exit=dlsym(RTLD_NEXT,"_exit");}
          }
          static int is_ed(void){
            if(exe_state<2){char b[300]={0};ssize_t n=readlink("/proc/self/exe",b,sizeof b-1);
              exe_state=(n>0&&strstr(b,"/Editor/Unity"))?2:3;}
            return exe_state==2;
          }
          static const char*outdir(void){const char*d=getenv("DIAG_OUT");return d&&*d?d:"/diag-out";}
          static int openout(const char*tag){
            char p[300];snprintf(p,sizeof p,"%s/%s-%d.txt",outdir(),tag,(int)getpid());
            return open(p,O_WRONLY|O_CREAT|O_APPEND,0644);
          }
          static void dump_ctx(int fd,const char*call,long a1,long a2){
            char buf[8192];int n;struct timespec ts;clock_gettime(CLOCK_MONOTONIC,&ts);
            n=snprintf(buf,sizeof buf,"\n=== KILLHOOK %s(%ld,%ld) mono=%ld.%03ld pid=%d tid=%d",
              call,a1,a2,(long)ts.tv_sec,ts.tv_nsec/1000000,(int)getpid(),(int)syscall(SYS_gettid));
            write(fd,buf,n);
            {char c[64]={0};int cf=open("/proc/self/comm",O_RDONLY);if(cf>=0){int r=(int)read(cf,c,63);close(cf);if(r>0)c[r-1]=0;}
             char e[300]={0};ssize_t r=readlink("/proc/self/exe",e,sizeof e-1);if(r>0)e[r]=0;
             n=snprintf(buf,sizeof buf," comm=%s exe=%s\n",c,e);write(fd,buf,n);}
            write(fd,"BT:\n",4);
            {void*bt[48];int nb=backtrace(bt,48);
             for(int i=0;i<nb;i++){Dl_info di;memset(&di,0,sizeof di);
               if(dladdr(bt[i],&di)&&di.dli_fname)
                 n=snprintf(buf,sizeof buf,"  #%02d %p %s +0x%lx %s\n",i,bt[i],di.dli_fname,
                   (unsigned long)((char*)bt[i]-(char*)di.dli_fbase),di.dli_sname?di.dli_sname:"");
               else n=snprintf(buf,sizeof buf,"  #%02d %p\n",i,bt[i]);
               write(fd,buf,n);}}
            write(fd,"FDS:\n",5);
            {DIR*d=opendir("/proc/self/fd");if(d){struct dirent*e;
             while((e=readdir(d))){if(e->d_name[0]=='.')continue;
               char lp[300],tb[300]={0};snprintf(lp,sizeof lp,"/proc/self/fd/%s",e->d_name);
               ssize_t r=readlink(lp,tb,sizeof tb-1);if(r<0)continue;tb[r]=0;
               n=snprintf(buf,sizeof buf,"  %s -> %s\n",e->d_name,tb);write(fd,buf,n);}closedir(d);}}
            write(fd,"TASKS:\n",7);
            {DIR*d=opendir("/proc/self/task");if(d){struct dirent*e;
             while((e=readdir(d))){if(e->d_name[0]=='.')continue;
               char lp[300],c[64]={0};snprintf(lp,sizeof lp,"/proc/self/task/%s/comm",e->d_name);
               int cf=open(lp,O_RDONLY);if(cf>=0){int r=(int)read(cf,c,63);close(cf);if(r>0)c[r-1]=0;}
               n=snprintf(buf,sizeof buf,"  %s %s\n",e->d_name,c);write(fd,buf,n);}closedir(d);}}
            write(fd,"MAPS:\n",6);
            {int mf=open("/proc/self/maps",O_RDONLY);if(mf>=0){char mb[8192];ssize_t r;
             while((r=read(mf,mb,sizeof mb))>0)write(fd,mb,r);close(mf);}}
          }
          static int interesting(pid_t pid,int sig){
            if(sig==9)return 1;
            if(pid<0)return 1;              /* killpg via kill(-pg) */
            if(pid==(pid_t)getpid()||pid==(pid_t)getpgrp())return 1;
            return 0;
          }
          /* DIAG V2: a SIGKILL aimed at a pid that is actually a thread inside
             THIS process (stale/recycled pid -> kill(tid) == kill(self)) must
             be blocked: it is the observed editor self-SIGKILL. Returns 1 when
             the target's Tgid equals our own pid. */
          static int self_target(pid_t pid){
            if(pid<=0||pid==(pid_t)getpid())return pid>0;
            char p[64],b[256];int f,r=-1;long tg=-1;
            snprintf(p,sizeof p,"/proc/%d/status",(int)pid);
            f=open(p,O_RDONLY);if(f<0)return 0;
            {int n=(int)read(f,b,sizeof b-1);close(f);if(n<=0)return 0;b[n]=0;}
            char*s=strstr(b,"Tgid:");if(!s)return 0;
            s+=5;while(*s==' '||*s=='\t')s++;
            tg=0;while(*s>='0'&&*s<='9'){tg=tg*10+(*s-'0');s++;}
            return tg==(long)getpid();
          }
          static int block_note(const char*call,long a1,long a2){
            int fd=openout("blocked");if(fd<0)return 0;
            dump_ctx(fd,call,a1,a2);close(fd);return 1;
          }
          int kill(pid_t pid,int sig){res();
            if(sig==9&&pid>0&&self_target(pid)){
              if(!in_hook){in_hook=1;block_note("BLOCKED-selfkill",pid,sig);in_hook=0;}
              return 0;}
            if(!in_hook&&interesting(pid,sig)){in_hook=1;int fd=openout("kill");
              if(fd>=0){dump_ctx(fd,"kill",pid,sig);close(fd);}in_hook=0;}
            return r_kill(pid,sig);}
          int killpg(pid_t pg,int sig){res();
            if(!in_hook){in_hook=1;int fd=openout("kill");
              if(fd>=0){dump_ctx(fd,"killpg",pg,sig);close(fd);}in_hook=0;}
            return r_killpg?r_killpg(pg,sig):r_kill(-pg,sig);}
          int tkill(pid_t t,int sig){res();
            if(sig==9&&self_target(t)){
              if(!in_hook){in_hook=1;block_note("BLOCKED-selftkill",t,sig);in_hook=0;}
              return 0;}
            if(!in_hook&&(sig==9||t==(pid_t)getpid())){in_hook=1;int fd=openout("kill");
              if(fd>=0){dump_ctx(fd,"tkill",t,sig);close(fd);}in_hook=0;}
            return r_tkill?r_tkill(t,sig):(int)syscall(SYS_tkill,t,sig);}
          int tgkill(pid_t g,pid_t t,int sig){res();
            if(sig==9&&g==(pid_t)getpid()){
              if(!in_hook){in_hook=1;block_note("BLOCKED-selftgkill",t,sig);in_hook=0;}
              return 0;}
            if(!in_hook&&(sig==9||g==(pid_t)getpid())){in_hook=1;int fd=openout("kill");
              if(fd>=0){dump_ctx(fd,"tgkill",t,sig);close(fd);}in_hook=0;}
            return r_tgkill?r_tgkill(g,t,sig):(int)syscall(SYS_tgkill,g,t,sig);}
          void _exit(int st){res();
            if(!in_hook&&is_ed()){in_hook=1;int fd=openout("exit");
              if(fd>=0){dump_ctx(fd,"_exit",st,0);close(fd);}in_hook=0;}
            if(r__exit)r__exit(st);syscall(SYS_exit_group,st);__builtin_unreachable();}
          static void dumpw(const void*b,size_t n){
            char h[160];struct timespec ts;clock_gettime(CLOCK_MONOTONIC,&ts);
            int hn=snprintf(h,sizeof h,"W %ld.%03ld n=%zu: ",(long)ts.tv_sec,ts.tv_nsec/1000000,n);
            r_write(io_fd,h,hn);
            size_t m=n>160?160:n;
            for(size_t i=0;i<m;i++){unsigned char c=((const unsigned char*)b)[i];
              char e[8];int en=(c>=32&&c<127&&c!='\\')?snprintf(e,8,"%c",c):snprintf(e,8,"\\x%02x",c);
              r_write(io_fd,e,en);}
            r_write(io_fd,"\n",1);
          }
          ssize_t write(int fd,const void*b,size_t n){res();
            ssize_t r=r_write(fd,b,n);
            if(!in_hook&&is_ed()&&fd!=1&&fd!=2){in_hook=1;
              if(io_fd<0)io_fd=openout("wr");
              if(io_fd>=0){char h[64];int hn=snprintf(h,sizeof h,"fd=%d ",fd);
                r_write(io_fd,h,hn);dumpw(b,n);}
              in_hook=0;}
            return r;}
          ssize_t send(int fd,const void*b,size_t n,int fl){res();
            ssize_t r=r_send?r_send(fd,b,n,fl):(ssize_t)syscall(SYS_sendto,fd,b,n,fl,0,0);
            if(!in_hook&&is_ed()){in_hook=1;
              if(io_fd<0)io_fd=openout("wr");
              if(io_fd>=0){char h[64];int hn=snprintf(h,sizeof h,"SEND fd=%d ",fd);
                r_write(io_fd,h,hn);dumpw(b,n);}
              in_hook=0;}
            return r;}
          ssize_t sendto(int fd,const void*b,size_t n,int fl,const struct sockaddr*a,socklen_t al){res();
            ssize_t r=r_sendto?r_sendto(fd,b,n,fl,a,al):(ssize_t)syscall(SYS_sendto,fd,b,n,fl,a,al);
            if(!in_hook&&is_ed()){in_hook=1;
              if(io_fd<0)io_fd=openout("wr");
              if(io_fd>=0){char h[64];int hn=snprintf(h,sizeof h,"SENDTO fd=%d ",fd);
                r_write(io_fd,h,hn);dumpw(b,n);}
              in_hook=0;}
            return r;}
          ssize_t writev(int fd,const struct iovec*iov,int cnt){res();
            ssize_t r=r_writev(fd,iov,cnt);
            if(!in_hook&&is_ed()&&fd!=1&&fd!=2){in_hook=1;
              if(io_fd<0)io_fd=openout("wr");
              if(io_fd>=0&&cnt>0){struct iovec*v=(struct iovec*)iov;
                char h[64];int hn=snprintf(h,sizeof h,"WV fd=%d iov=%d ",fd,cnt);
                r_write(io_fd,h,hn);dumpw(v->iov_base,v->iov_len);}
              in_hook=0;}
            return r;}
          ssize_t sendmsg(int fd,const struct msghdr*m,int fl){res();
            ssize_t r=r_sendmsg?r_sendmsg(fd,m,fl):(ssize_t)syscall(SYS_sendmsg,fd,m,fl);
            if(!in_hook&&is_ed()){in_hook=1;
              if(io_fd<0)io_fd=openout("wr");
              if(io_fd>=0){const struct msghdr*h=m;
                char hb[64];int hn=snprintf(hb,sizeof hb,"SENDMSG fd=%d ",fd);
                r_write(io_fd,hb,hn);
                if(h&&h->msg_iov&&h->msg_iovlen>0)dumpw(h->msg_iov->iov_base,h->msg_iov->iov_len);}
              in_hook=0;}
            return r;}
          void exit(int st){res();
            if(!in_hook&&is_ed()){in_hook=1;int fd=openout("exit");
              if(fd>=0){dump_ctx(fd,"exit",st,0);close(fd);}in_hook=0;}
            if(r_exit)r_exit(st);syscall(SYS_exit_group,st);__builtin_unreachable();}
          void abort(void){res();
            if(!in_hook){in_hook=1;int fd=openout("kill");
              if(fd>=0){dump_ctx(fd,"abort",0,0);close(fd);}in_hook=0;}
            if(r_abort)r_abort();syscall(SYS_tgkill,getpid(),syscall(SYS_gettid),6);__builtin_unreachable();}
          EOF
          gcc -O2 -fPIC -shared -o "$RUNNER_TEMP/diag/killshim.so" "$RUNNER_TEMP/diag/killshim.c" -ldl -rdynamic 2>&1 | head -20
          ls -la "$RUNNER_TEMP/diag/"
          # If the shim cannot load inside the pinned image (glibc mismatch),
          # remove it — a missing LD_PRELOAD file is a warning, not an error,
          # so containers keep running unshimmed instead of dying at exec.
          if docker run --rm -v "$RUNNER_TEMP/diag:/diag:ro" "${{ env.UNITY_LINUX_IMAGE_TAG }}" \
               bash -c 'LD_PRELOAD=/diag/killshim.so /bin/true' 2>"$RUNNER_TEMP/diag/preload-probe.err"; then
            echo 'killshim loads inside image: OK'
          else
            echo 'killshim FAILED to load inside image — removing (containers stay unshimmed)'
            cat "$RUNNER_TEMP/diag/preload-probe.err" | head -10
            rm -f "$RUNNER_TEMP/diag/killshim.so"
          fi
          cat > "$RUNNER_TEMP/diag/watch.sh" <<'EOF'
          #!/usr/bin/env bash
          OUT="$1"
          docker events --since "$(date +%s)" --filter type=container --format '{{.ID}} {{.Status}} {{.From}}' 2>/dev/null | \
          while read -r cid st img; do
            [ "$st" = "start" ] || continue
            case "$img" in *unityci*|*editor*) ;; *) continue;; esac
            d="$OUT/$cid"; mkdir -p "$d"
            echo "$cid img=$img at=$(date -Is)" > "$d/meta.txt"
            pid1=$(docker inspect -f '{{.State.Pid}}' "$cid" 2>/dev/null)
            echo "pid1=$pid1" >> "$d/meta.txt"
            [ -n "$pid1" ] && [ "$pid1" != "0" ] || continue
            ( strace -f -tt -T -yy -s 120 \
                -e trace=kill,tkill,tgkill,pidfd_send_signal,exit,exit_group,execve,execveat,%process \
                -o "$d/strace.txt" -p "$pid1" >>"$d/strace-meta.log" 2>&1 & ) 
            ( while docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null | grep -q '^true$'; do
                ts=$(date +%s.%3N)
                { echo "=== t=$ts"; docker top "$cid" -eo pid,ppid,comm,etimes 2>/dev/null; } >> "$d/procs.txt"
                { echo "=== t=$ts"; for hp in $(docker top "$cid" -eo pid --no-headers 2>/dev/null); do
                    printf 'h=%s %s: ' "$hp" "$(cat /proc/$hp/comm 2>/dev/null)";
                    grep -h NSpid /proc/$hp/task/*/status 2>/dev/null | awk '{printf "%s ",$NF}';
                    echo;
                  done; } >> "$d/cprocs.txt"
                upid=$(docker top "$cid" -eo pid,comm 2>/dev/null | awk '$2=="Unity"{print $1; exit}')
                if [ -n "$upid" ]; then
                  { echo "=== t=$ts upid=$upid"; ls -l /proc/$upid/fd 2>/dev/null | sed -n 's/^.* \([0-9]*\) -> \(.*\)$/fd \1 -> \2/p';
                    for t in /proc/$upid/task/*; do printf '%s=%s ' "$(basename "$t")" "$(cat "$t/comm" 2>/dev/null)"; done; echo; } >> "$d/fds.txt"
                fi
                find "$RUNNER_TEMP" -maxdepth 7 -type s -printf '%T+ %p\n' 2>/dev/null >> "$d/sockfiles.txt"
                for lf in $(find "$RUNNER_TEMP" -maxdepth 8 \( -name 'Unity.Licensing.Client*' -o -name 'licensing*.log' -o -name 'upm.log' -o -name 'Editor.log' \) -type f 2>/dev/null | head -8); do
                  { echo "--- t=$ts $lf"; tail -4 "$lf"; } >> "$d/liclog.txt" 2>/dev/null
                done
                sleep 1
              done
              echo "container $cid gone at $(date -Is)" >> "$d/meta.txt" ) &
          done
          EOF
          chmod +x "$RUNNER_TEMP/diag/watch.sh"
          (sudo env RUNNER_TEMP="$RUNNER_TEMP" bash "$RUNNER_TEMP/diag/watch.sh" "$RUNNER_TEMP/diag-run" > "$RUNNER_TEMP/diag-run/watch.log" 2>&1 & echo $! > "$RUNNER_TEMP/diag-watch.pid")
          cat > "$RUNNER_TEMP/diag/liccfg.sh" <<'EOF'
          #!/bin/bash
          # DIAG V1: stop the editor-spawned licensing client from auto-exiting
          # when its IPC session count hits zero (suspected dead-pipe ->
          # "IPC channel ... aborting" -> killpg race at domain reload).
          PJ=/root/.config/unity3d/Unity/config/production.json
          mkdir -p "$(dirname "$PJ")"
          python3 - "$PJ" <<'PY'
          import json, os, sys
          p = sys.argv[1]
          d = {}
          if os.path.exists(p) and os.path.getsize(p):
              try:
                  d = json.load(open(p))
              except Exception:
                  d = {}
          d["autoShutdownDelaySeconds"] = 86400
          json.dump(d, open(p, "w"), indent=2)
          PY
          EOF
          chmod +x "$RUNNER_TEMP/diag/liccfg.sh"
          echo "diag probes armed"

      - name: Inspect unity image internals (investigation-only)
        if: steps.unity-scope.outputs.run == 'true'
        shell: bash
        run: |
          set -uo pipefail
          IMG="${{ env.UNITY_LINUX_IMAGE_TAG }}"
          BIN="$RUNNER_TEMP/imgbin"; mkdir -p "$BIN"
          timeout -k 10 240 docker run --rm "$IMG" bash -c '
            echo "== unity-editor wrapper =="
            which unity-editor || true
            ls -lL /usr/bin/unity-editor /opt/unity/Editor/unity-editor 2>/dev/null || true
            for w in $(command -v unity-editor 2>/dev/null) /opt/unity/Editor/unity-editor; do
              [ -f "$w" ] && { echo "---- $w"; head -c 8 "$w" | od -An -c | head -1; head -200 "$w" 2>/dev/null | head -160; }
            done
            echo "== Editor dir =="; ls -la /opt/unity/Editor | head -80
            echo "== Tools dir =="; ls -la /opt/unity/Editor/Data/Tools 2>/dev/null
            echo "== Licensing client dir =="
            find /opt/unity -type d -iname "*licens*" 2>/dev/null
            find /opt/unity/Editor/Data/Resources/Licensing -maxdepth 3 2>/dev/null | head -60
            echo "== licensing client dll.config =="
            find /opt/unity -name "Unity.Licensing.Client.dll.config" -exec cat {} + 2>/dev/null
            echo "== licensing client help =="
            c=$(find /opt/unity -name "Unity.Licensing.Client" -type f | head -1)
            [ -n "$c" ] && timeout -k 5 30 "$c" --help 2>&1 | head -70
            echo "== Tools binary self-tests =="
            for t in UnityAutoQuitter Unity.DataStore; do
              f=/opt/unity/Editor/Data/Tools/$t
              [ -f "$f" ] && { echo "---- $t --help"; timeout -k 5 10 "$f" --help 2>&1 | head -30 || echo "(timeout/err rc=$?)"; }
            done
          ' 2>&1 | tee artifacts/unity-diag/image-layout.txt || true
          timeout -k 10 300 docker run --rm "$IMG" bash -c '
            s() { grep -aoE "[ -~]{$2,}" "$1" 2>/dev/null; }
            echo "=== abort/licensing strings in Unity binary ==="
            s /opt/unity/Editor/Unity 10 | grep -iE "ipc channel|licensing|license|aborting|fatal|killpg|watchdog|auto.?quit|datastore|entitlement" | sort -u | head -160
            echo "=== UNITY_* env toggles ==="
            grep -aoE "UNITY_[A-Z0-9_]+" /opt/unity/Editor/Unity | sort -u | head -140
            echo "=== licensing client dlls: timer/session/exit strings ==="
            for c in $(find /opt/unity -name "Unity.Licensing.*.dll" -o -name "Unity.Licensing.Client" -type f 2>/dev/null) /opt/unity/Editor/Data/Tools/UnityAutoQuitter /opt/unity/Editor/Data/Tools/Unity.DataStore; do
              [ -f "$c" ] || continue
              echo "---- $c"
              timeout -k 5 60 grep -aoE "[ -~]{10,}" "$c" 2>/dev/null | grep -iE "exit.?timer|idle|shut ?down|session|channel|pipe|handshake|relaunch|respawn" | sort -u | head -45
            done
            echo "=== licensing ipc/abort strings in Unity binary (wide) ==="
            s /opt/unity/Editor/Unity 10 | grep -iE "channel.*(exist|lost|connect)|named.?pipe|session.*(end|drop|timeout)|exit.*(timer|code)|signal|abort" | sort -u | head -120
          ' 2>&1 | tee artifacts/unity-diag/image-strings.txt || true
          echo "inspect done"

      - name: Unity materialization (licence retry <=5)
        if: steps.unity-scope.outputs.run == 'true'
        timeout-minutes: 30
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          CACHE_HIT_LIBRARY: ${{ steps.cache-unity-library.outputs.cache-hit }}
          UNITY_KILL_PROBE: ${{ vars.UNITY_KILL_PROBE }}
        run: |
          set -uo pipefail
          source .devin/scripts/cache_telemetry.sh
          start=$SECONDS
          libhit=miss; if [ "${CACHE_HIT_LIBRARY:-}" = "true" ]; then libhit=hit; fi
          sudo systemctl stop systemd-oomd.service systemd-oomd.socket 2>/dev/null || true
          sudo systemctl mask --runtime systemd-oomd.service 2>/dev/null || true
          systemctl is-active systemd-oomd 2>/dev/null || true
          busctl introspect org.freedesktop.oom1 /org/freedesktop/oom1 2>/dev/null | head -5 || true
          mkdir -p "$RUNNER_TEMP/unity-lic" "$RUNNER_TEMP/unity-cache" "$RUNNER_TEMP/unity-cfg"
          if [ "${UNITY_KILL_PROBE:-}" = "true" ]; then
            # ADR-0077: editor version probes belong to the opt-in kill-probe.
            docker run --rm --shm-size=2g "${{ env.UNITY_LINUX_IMAGE_TAG }}" unity-editor -version
            for i in 1 2 3 4; do
              docker run --rm --shm-size=4g "${{ env.UNITY_LINUX_IMAGE_TAG }}" bash -c '/opt/unity/Editor/Unity -batchmode -nographics -version -logFile -' >/dev/null 2>&1
              echo "direct-version probe $i rc=$?"
            done
          fi
          # ADR-0077: snapshot the cache-restored Library before any editor opens
          # it. A retry after an editor self-kill (rc=137) restarts warm from
          # this snapshot; the Library a killed editor wrote is never reused
          # (BLK-017). Container output is root-owned: sudo.
          mat_snap="$RUNNER_TEMP/unity-lib-restored"
          sudo rm -rf "$mat_snap"
          [ -d client/Library ] && sudo cp -a client/Library "$mat_snap"
          prev=
          for i in 1 2 3 4 5; do
            if [ "$i" -gt 1 ]; then
              if [ "$prev" = killed ] && [ "$i" -le 3 ] && [ -d "$mat_snap" ]; then
                sudo rm -rf client/Library client/Temp
                sudo cp -a "$mat_snap" client/Library
                echo "attempt $i: warm retry from the restored Library snapshot"
              else
                # Cold retry: attempt 1 keeps a cache-restored Library
                # (CI-002); this retry starts from a clean Library.
                sudo find client/Library -mindepth 1 -maxdepth 1 ! -name PackageCache -exec rm -rf {} + || true
                echo "attempt $i: cold retry from a clean Library"
              fi
            fi
            # Every Unity editor invocation keeps network egress — the licensing
            # client's access-token refresh needs it (BLK-008).
            getent hosts license.unity3d.com services.api.unity.com 2>/dev/null | head -4 || true
            curl -m 5 -so /dev/null -w 'lic-egress=%{http_code}\n' https://license.unity3d.com 2>/dev/null || true
            ip route get 1.1.1.1 2>/dev/null | head -1 || true
            # /root/.cache must stay writable — the licensing client persists
            # token/state under .cache/unity3d or it self-terminates (BLK-009).
            cid=$(docker run -d -i --shm-size=4g --security-opt apparmor=unconfined \
              -v "${{ github.workspace }}:/github/workspace" \
              -v "$RUNNER_TEMP/unity-lic:/root/.local/share/unity3d" \
              -v "$RUNNER_TEMP/unity-cfg:/root/.config/unity3d" \
              -v "$RUNNER_TEMP/unity-cache:/root/.cache" \
              -v "$RUNNER_TEMP/diag:/diag:ro" \
              -v "$RUNNER_TEMP/diag-out:/diag-out" \
              -v /etc/machine-id:/etc/machine-id:ro \
              -w /github/workspace \
              -e UNITY_PASSWORD -e UNITY_SERIAL -e UNITY_EMAIL \
              -e LIBGL_ALWAYS_SOFTWARE=1 \
              -e MONO_GC_PARAMS=nursery-size=64m \
              -e LD_PRELOAD=/diag/killshim.so -e DIAG_OUT=/diag-out \
              "${{ env.UNITY_LINUX_IMAGE_TAG }}" \
              bash -c '
                bash /diag/liccfg.sh || true
                EXTRA=""
                if [ ! -s /root/.local/share/unity3d/Unity/Unity_lic.ulf ]; then
                  rm -f /root/.local/share/unity3d/Unity/Unity_lic.ulf
                  EXTRA="-serial $UNITY_SERIAL -username $UNITY_EMAIL -password $UNITY_PASSWORD"
                fi
                unity-editor -batchmode -projectPath /github/workspace/client $EXTRA -quit -logFile -
              ') || cid=
            df -h / "$RUNNER_TEMP" | tail -2 || true
            docker system df 2>/dev/null | tail -3 || true
            if [ -n "$cid" ]; then
              docker logs -f "$cid" > "$RUNNER_TEMP/unity-materialize.log" 2>&1 || true
              rc=$(docker wait "$cid")
              docker rm -f "$cid" >/dev/null 2>&1 || true
            else
              rc=199
            fi
            tail -200 "$RUNNER_TEMP/unity-materialize.log" 2>/dev/null || true
            # DIAG: preserve licensing/cfg state of this attempt before retry wipe
            mkdir -p "artifacts/unity-diag/mat-attempt$i"
            sudo cp -a "$RUNNER_TEMP/unity-lic" "$RUNNER_TEMP/unity-cfg" "artifacts/unity-diag/mat-attempt$i/" 2>/dev/null || true
            cp "$RUNNER_TEMP/unity-materialize.log" "artifacts/unity-diag/mat-attempt$i/" 2>/dev/null || true
            # DIAG: capture lock/state files that may carry stale pids across retries
            mkdir -p "artifacts/unity-diag/mat-attempt$i/locks"
            for lf in client/Temp/UnityLockfile $(find client/Library client/Temp -name '*lock*' -o -name 'UnityLockfile' 2>/dev/null); do
              [ -f "$lf" ] && sudo cp -a "$lf" "artifacts/unity-diag/mat-attempt$i/locks/" 2>/dev/null && sudo sh -c "xxd '$lf' | head -8 >> 'artifacts/unity-diag/mat-attempt$i/locks/'$(basename '$lf').hex" || true
            done
            # DIAG: capture the stores a stale worker-pid could live in (ILPP runner
            # state, uds.db, Temp). Post-hoc byte-scan for the kill-target value.
            sudo cp -a client/Temp "artifacts/unity-diag/mat-attempt$i/Temp" 2>/dev/null || true
            sudo find client/Library -size -4M \( -iname '*pid*' -o -iname '*ilpp*' -o -iname '*runner*' -o -name 'uds.db*' -o -name 'uds.lock' \) -exec cp --parents -a {} "artifacts/unity-diag/mat-attempt$i/" \; 2>/dev/null || true
            sudo find client/Temp -size -4M -type f -exec sh -c 'for f; do grep -lE "pid|process" "$f" 2>/dev/null; done' _ {} + >> "artifacts/unity-diag/mat-attempt$i/pidfiles.list" 2>/dev/null || true
            sudo chmod -R a+r "artifacts/unity-diag/mat-attempt$i" 2>/dev/null || true
            if grep -q 'Exiting batchmode successfully' "$RUNNER_TEMP/unity-materialize.log" && ! grep -q 'Scripts have compiler errors' "$RUNNER_TEMP/unity-materialize.log"; then
              cache_telemetry_emit unity-library "$libhit" "$((SECONDS-start))"
              exit 0
            fi
            dead=$(docker ps -ql 2>/dev/null)
            docker inspect "$dead" --format 'container-state: OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}' 2>/dev/null || true
            docker rm -f "$dead" >/dev/null 2>&1 || true
            if [ "$rc" -eq 198 ]; then
              cache_telemetry_emit unity-library "$libhit" "$((SECONDS-start))"
              echo "unity licence activation failed deterministically (rc=$rc) - not retrying. Fix UNITY_SERIAL/licence secrets." >&2
              exit 1
            fi
            # ADR-0077: only a licence/infra failure waits 60 s. An editor kill
            # retries at once (warm); compiler errors retry at once on a clean
            # Library (ADR-0073 item 5) and stop when they repeat.
            if grep -q 'Scripts have compiler errors' "$RUNNER_TEMP/unity-materialize.log"; then
              if [ "$prev" = compile ]; then
                cache_telemetry_emit unity-library "$libhit" "$((SECONDS-start))"
                echo "unity materialization: compiler errors on two consecutive attempts - deterministic, not retrying" >&2
                exit 1
              fi
              prev=compile; why="compiler errors; retrying now on a clean Library"
            elif [ "$rc" -eq 137 ]; then
              prev=killed; why="editor killed; retrying now"
            else
              prev=other; why="retrying after 60s"
            fi
            echo "unity materialization attempt $i failed (rc=$rc); $why"
            sudo dmesg 2>/dev/null | grep -iE 'oom|kill' | tail -10 || true
            sudo journalctl --no-pager -n 60 2>/dev/null | grep -iE 'oom|kill|unity' | tail -15 || true
            free -m
            tail -100 "$RUNNER_TEMP/unity-cfg/Editor.log" 2>/dev/null || true
            find "$RUNNER_TEMP/unity-cfg" -name 'crash*' -o -name '*.dmp' -o -name 'core*' 2>/dev/null | head || true
            for f in $(find "$RUNNER_TEMP/unity-lic" -type f \( -name '*.log' -o -name '*.log.*' \) 2>/dev/null | sort); do
              echo "== licensing log $f"; tail -60 "$f" || true
            done
            [ "$i" -lt 5 ] && [ "$prev" = other ] && sleep 60
          done
          cache_telemetry_emit unity-library "$libhit" "$((SECONDS-start))"
          echo "unity materialization failed after 5 attempts (licence/infra)" >&2
          exit 1

      - name: Dump unity-materialize.log on failure
        if: failure() && steps.unity-scope.outputs.run == 'true'
        shell: bash
        run: tail -c 200000 "$RUNNER_TEMP/unity-materialize.log" 2>/dev/null || echo 'no unity-materialize.log produced'

      - name: Unity EditMode+PlayMode tests
        if: steps.unity-scope.outputs.run == 'true' && steps.unity-plan.outputs.modes != ''
        timeout-minutes: 30
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_MODES: ${{ steps.unity-plan.outputs.modes }}
        run: |
          set -euo pipefail
          sudo systemctl stop systemd-oomd.service systemd-oomd.socket 2>/dev/null || true
          sudo systemctl mask --runtime systemd-oomd.service 2>/dev/null || true
          systemctl is-active systemd-oomd 2>/dev/null || true
          busctl introspect org.freedesktop.oom1 /org/freedesktop/oom1 2>/dev/null | head -5 || true
          mkdir -p artifacts/unity-tests "$RUNNER_TEMP/unity-lic" "$RUNNER_TEMP/unity-cache"
          # BLK-017: snapshot the Library the materialization editor left on its clean
          # -quit exit; every test container (first attempt and retries) starts from
          # this snapshot, never from a Library last written by an editor that ended
          # in its SIGKILL exit (that state makes the next editor self-kill at its
          # first domain reload). Container output is root-owned: sudo.
          lib_snap="$RUNNER_TEMP/unity-lib-snap"
          sudo rm -rf "$lib_snap"
          sudo cp -a client/Library "$lib_snap"
          verdict_failed=
          for mode in $UNITY_MODES; do
            ok=
            # BLK-014: PlayMode gets a wider budget — the mid-run watchdog
            # kill still burns attempts even under setsid containment.
            max=5; [ "$mode" = PlayMode ] && max=8
            for i in $(seq 1 "$max"); do
              free -m
              arc=0
              sudo rm -rf client/Library
              sudo cp -a "$lib_snap" client/Library
              getent hosts license.unity3d.com services.api.unity.com 2>/dev/null | head -4 || true
              curl -m 5 -so /dev/null -w 'lic-egress=%{http_code}\n' https://license.unity3d.com 2>/dev/null || true
              # /root/.cache writable for the licensing client (BLK-009).
              lcid=$(docker run -d -i --rm \
                -v "$RUNNER_TEMP/unity-lic:/root/.local/share/unity3d" \
                -v "$RUNNER_TEMP/unity-cfg:/root/.config/unity3d" \
                -v "$RUNNER_TEMP/unity-cache:/root/.cache" \
                -v "$RUNNER_TEMP/diag:/diag:ro" \
                -v "$RUNNER_TEMP/diag-out:/diag-out" \
                -v /etc/machine-id:/etc/machine-id:ro \
                -e UNITY_PASSWORD -e UNITY_SERIAL -e UNITY_EMAIL \
                -e LD_PRELOAD=/diag/killshim.so -e DIAG_OUT=/diag-out \
                "${{ env.UNITY_LINUX_IMAGE_TAG }}" \
                bash -c 'bash /diag/liccfg.sh || true; if [ -s /root/.local/share/unity3d/Unity/Unity_lic.ulf ]; then exit 0; fi; timeout -k 15 300 unity-editor -batchmode -serial "$UNITY_SERIAL" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -quit -logFile -') || lcid=
              if [ -n "$lcid" ]; then arc=$(docker wait "$lcid"); else arc=199; fi
              if [ "$arc" -eq 198 ]; then
                echo "unity licence activation failed deterministically (rc=$arc) - not retrying" >&2
                exit 1
              fi
              rc=$arc
              rm -f "artifacts/unity-tests/$mode-results.xml" "$RUNNER_TEMP/unity-tests.log"
              if [ "$arc" -eq 0 ]; then
                # BLK-017: every test container also starts with fresh editor state
                # outside Library (user config/licensing dirs, client/Temp): only the
                # activated licence file carries over.
                att="$RUNNER_TEMP/unity-att"
                # container writes are root-owned: remove with sudo
                sudo rm -rf "$att" client/Temp
                mkdir -p "$att/unity-lic/Unity" "$att/unity-cfg" "$att/unity-cache"
                cp "$RUNNER_TEMP/unity-lic/Unity/Unity_lic.ulf" "$att/unity-lic/Unity/"
                # /root/.cache writable for the licensing client (BLK-009).
                # -nographics: no GL device, no Xvfb/llvmpipe path — removes the GfxDevice
                # init surface where the editor's abort path fired (BLK-010).
                # -logFile is a REAL file under the workspace bind-mount: a SIGKILL no
                # longer drops the buffered tail containing the fatal line.
                cid=$(docker run -d -i --shm-size=4g --security-opt apparmor=unconfined \
                  -v "${{ github.workspace }}:/github/workspace" \
                  -v "$att/unity-lic:/root/.local/share/unity3d" \
                  -v "$att/unity-cfg:/root/.config/unity3d" \
                  -v "$att/unity-cache:/root/.cache" \
                  -v "$RUNNER_TEMP/diag:/diag:ro" \
                  -v "$RUNNER_TEMP/diag-out:/diag-out" \
                  -v /etc/machine-id:/etc/machine-id:ro \
                  -w /github/workspace \
                  -e UNITY_PASSWORD -e UNITY_SERIAL -e UNITY_EMAIL \
                  -e MONO_GC_PARAMS=nursery-size=64m \
                  -e MODE="$mode" \
                  -e LD_PRELOAD=/diag/killshim.so -e DIAG_OUT=/diag-out \
                  "${{ env.UNITY_LINUX_IMAGE_TAG }}" \
                  bash -c '
                    bash /diag/liccfg.sh || true
                    # BLK-014: setsid puts the editor in its own process group, so
                    # the watchdog killpg kills only that group — this wrapper is the
                    # container PID 1 and survives to pick the exit code itself.
                    setsid -w unity-editor -batchmode -nographics -projectPath /github/workspace/client \
                      -runTests -testPlatform "$MODE" \
                      -testResults "/github/workspace/artifacts/unity-tests/$MODE-results.xml" \
                      -logFile "/github/workspace/artifacts/unity-tests/$MODE-editor.log"
                    rc=$?
                    # A kill after the verdict was committed (results.xml Passed)
                    # is not a failure — exit 0 on behalf of the killed editor.
                    # A mid-run kill leaves no Passed XML and the real rc (137)
                    # passes through so the outer retry loop still fires.
                    if [ "$rc" -ne 0 ] \
                      && [ -f "/github/workspace/artifacts/unity-tests/$MODE-results.xml" ] \
                      && grep -q "result=\"Passed\"" "/github/workspace/artifacts/unity-tests/$MODE-results.xml"; then
                      exit 0
                    fi
                    exit "$rc"
                  ') || cid=
                df -h / "$RUNNER_TEMP" | tail -2 || true
                docker system df 2>/dev/null | tail -3 || true
                if [ -n "$cid" ]; then
                  docker logs -f "$cid" > "$RUNNER_TEMP/unity-tests.log" 2>&1 || true
                  rc=$(docker wait "$cid")
                  docker rm -f "$cid" >/dev/null 2>&1 || true
                else
                  rc=199
                fi
                tail -200 "$RUNNER_TEMP/unity-tests.log" 2>/dev/null || true
                grep -E 'Licensing|license|Access token' "$RUNNER_TEMP/unity-tests.log" 2>/dev/null | tail -10 || true
                # the real editor log survives a SIGKILL — print head + tail (BLK-010)
                echo "== artifacts/unity-tests/$mode-editor.log (head 60) =="
                head -60 "artifacts/unity-tests/$mode-editor.log" 2>/dev/null || true
                echo "== artifacts/unity-tests/$mode-editor.log (tail 300) =="
                tail -300 "artifacts/unity-tests/$mode-editor.log" 2>/dev/null || true
              fi
              # DIAG: preserve per-attempt licensing/cfg/cfg-cache state + editor log
              mkdir -p "artifacts/unity-diag/$mode-attempt$i"
              sudo cp -a "$att" "artifacts/unity-diag/$mode-attempt$i/att" 2>/dev/null || true
              cp "artifacts/unity-tests/$mode-editor.log" "artifacts/unity-diag/$mode-attempt$i/editor.log" 2>/dev/null || true
              cp "$RUNNER_TEMP/unity-tests.log" "artifacts/unity-diag/$mode-attempt$i/container.log" 2>/dev/null || true
              sudo chmod -R a+r "artifacts/unity-diag/$mode-attempt$i" 2>/dev/null || true
              # BLK-013: the editor's watchdog SIGKILLs its own process group
              # during shutdown ~5s AFTER 'Test run completed. Exiting with
              # code 0' — the verdict was already written; rc=137 then does
              # not mean failure. The PASS verdict requires the completion
              # line in the real -logFile AND a Passed results.xml (both must
              # have been committed before the kill could fire).
              if grep -q 'Test run completed. Exiting with code 0' "artifacts/unity-tests/$mode-editor.log" 2>/dev/null \
                && [ -f "artifacts/unity-tests/$mode-results.xml" ] \
                && grep -q '<test-run .*result="Passed"' "artifacts/unity-tests/$mode-results.xml" \
                && ! grep -q 'Scripts have compiler errors' "$RUNNER_TEMP/unity-tests.log"; then
                echo "unity $mode tests PASSED (rc=$rc — post-completion kill treated as pass)"
                ok=1; break
              fi
              # ADR-0077: a completed run with a results XML that is not Passed
              # is a real test verdict — final, never retried (retries exist for
              # editor kills, which leave no verdict). The other planned modes
              # still run; the step fails at the end and the verifier reports Q3.
              if grep -q 'Test run completed. Exiting with code' "artifacts/unity-tests/$mode-editor.log" 2>/dev/null \
                && [ -f "artifacts/unity-tests/$mode-results.xml" ]; then
                echo "unity $mode tests completed with a failing verdict (rc=$rc) - final, not retried" >&2
                verdict_failed="$verdict_failed $mode"
                ok=final; break
              fi
              dead=$(docker ps -ql 2>/dev/null)
              docker inspect "$dead" --format 'container-state: OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}' 2>/dev/null || true
              docker rm -f "$dead" >/dev/null 2>&1 || true
              sudo dmesg 2>/dev/null | grep -iE 'oom|kill' | tail -10 || true
              sudo journalctl --no-pager -n 60 2>/dev/null | grep -iE 'oom|kill|unity' | tail -15 || true
              free -m
              tail -100 "$RUNNER_TEMP/unity-att/unity-cfg/Editor.log" 2>/dev/null || true
              find "$RUNNER_TEMP/unity-att/unity-cfg" -name 'crash*' -o -name '*.dmp' -o -name 'core*' 2>/dev/null | head || true
              for f in $(find "$RUNNER_TEMP/unity-att/unity-lic" -type f \( -name '*.log' -o -name '*.log.*' \) 2>/dev/null | sort); do
                echo "== licensing log $f"; tail -60 "$f" || true
              done
              echo "unity $mode tests attempt $i failed (rc=$rc); retrying"
              sleep 20
            done
            if [ -z "$ok" ]; then
              echo "unity $mode tests failed after $max attempts" >&2
              exit 1
            fi
          done
          # leave the clean snapshot for the Library cache save, not the state of
          # the last (SIGKILL-ended) test editor (BLK-017)
          sudo rm -rf client/Library
          sudo cp -a "$lib_snap" client/Library
          if [ -n "$verdict_failed" ]; then
            echo "unity tests failed:$verdict_failed (results uploaded; the verifier reports the Q3 failure)" >&2
            exit 1
          fi

      - name: Dump kill-probe diagnostics
        if: always() && steps.unity-scope.outputs.run == 'true' && vars.UNITY_KILL_PROBE == 'true'
        shell: bash
        run: |
          echo '=== audit kill/tgkill events (sender pid/comm/exe) ==='
          sudo ausearch -k unitykill -ts recent > "$RUNNER_TEMP/audit-kills.txt" 2>/dev/null || true
          grep -E 'pidfd_send_signal|a2=9\b' "$RUNNER_TEMP/audit-kills.txt" | head -60 || true
          sudo grep -i 'unitykill\|SIGKILL' /var/log/audit/audit.log 2>/dev/null | tail -40 || true
          echo '=== avc/seccomp/anom_abend audit records ==='
          sudo ausearch -m avc,user_avc,seccomp,anom_abend -ts recent 2>/dev/null | tail -40 || true
          echo '=== memcg memory.events (docker cgroups) ==='
          sudo find /sys/fs/cgroup -name 'memory.events' -path '*docker*' -exec sh -c 'echo "{}:"; cat {}' \; 2>/dev/null || true
          echo '=== audit exit/exit_group events (key exits) ==='
          sudo ausearch -k exits -ts recent > "$RUNNER_TEMP/audit-exits.txt" 2>/dev/null || true
          tail -120 "$RUNNER_TEMP/audit-exits.txt" 2>/dev/null || true
          echo '=== journald oomd/memory-kill records ==='
          sudo journalctl -k -b --no-pager 2>/dev/null | grep -icE 'oom' || true
          sudo journalctl -b --no-pager 2>/dev/null | grep -iE 'oomd|killed.*memory|signal.*unity' | tail -20 || true
          sudo journalctl -k -b --no-pager 2>/dev/null | grep -iE 'apparmor|avc|seccomp|denied' | tail -20 || true
          echo '=== journalctl all units, last 3 minutes ==='
          sudo journalctl --since '-3 min' --no-pager 2>/dev/null || true
          echo '=== docker daemon events ==='
          cat "$RUNNER_TEMP/docker-events.log" 2>/dev/null | tail -40 || true
          kill "$(cat "$RUNNER_TEMP/docker-events.pid" 2>/dev/null)" 2>/dev/null || true
          echo '=== trace_pipe stream (full capture: signal_generate/deliver + exits) ==='
          T=$(cat /tmp/tracefs-dir 2>/dev/null || echo /sys/kernel/tracing)
          sudo kill "$(cat "$RUNNER_TEMP/trace-pipe.pid" 2>/dev/null)" 2>/dev/null || true
          sleep 1
          sudo cat "$RUNNER_TEMP/trace-pipe.log" 2>/dev/null > "$RUNNER_TEMP/trace-pipe.txt" || true
          wc -l "$RUNNER_TEMP/trace-pipe.txt" 2>/dev/null || true
          echo '--- sig=9 senders (SIGKILL source comm/pid) ---'
          grep -nE 'sig=9([^0-9]|$)' "$RUNNER_TEMP/trace-pipe.txt" 2>/dev/null || echo 'no sig=9 signal_generate events captured'
          echo '--- fatal sigs (4/6/7/8/11) + Unity exits ---'
          grep -nE 'sig=(4|6|7|8|11)([^0-9]|$)' "$RUNNER_TEMP/trace-pipe.txt" 2>/dev/null | tail -60 || true
          grep -nE 'comm=Unity|Unity-[0-9]+' "$RUNNER_TEMP/trace-pipe.txt" 2>/dev/null | tail -40 || true
          sudo bash -c "echo 0 > '$T/events/signal/signal_generate/enable'; echo 0 > '$T/events/signal/signal_generate/filter'; [ -d '$T/events/signal/signal_deliver' ] && echo 0 > '$T/events/signal/signal_deliver/enable'; [ -d '$T/events/sched/sched_process_exit' ] && echo 0 > '$T/events/sched/sched_process_exit/enable'" 2>/dev/null || true
          echo '=== cgroup_kill writers (bpftrace) ==='
          cat "$RUNNER_TEMP/cgroup-kill.log" 2>/dev/null | tail -30 || true
          sudo pkill -f 'bpftrace -e' 2>/dev/null || true
          sudo auditctl -D -k unitykill 2>/dev/null || true
          sudo auditctl -D -k exits 2>/dev/null || true
          # DIAG: per-container probe dumps + killshim records
          echo '=== DIAG killshim records (LD_PRELOAD intercepts) ==='
          for f in "$RUNNER_TEMP/diag-out"/kill-* "$RUNNER_TEMP/diag-out"/exit-*; do
            [ -f "$f" ] && { echo "---- $f"; sudo cat "$f" | head -120; } || true
          done
          ls -la "$RUNNER_TEMP/diag-out" 2>/dev/null | head -40 || true
          echo '=== DIAG per-container probes ==='
          for d in "$RUNNER_TEMP/diag-run"/*/; do
            [ -d "$d" ] || continue
            echo "---- $d"; sudo cat "$d/meta.txt" 2>/dev/null
            echo '-- strace kill/exit/exec tail:'
            sudo grep -E 'kill|tgkill|exit_group|execve' "$d/strace.txt" 2>/dev/null | tail -50 || true
            echo '-- process tree (last snapshot):'
            sudo tail -80 "$d/procs.txt" 2>/dev/null || true
            echo '-- unity fd/task snapshots (last 160):'
            sudo tail -160 "$d/fds.txt" 2>/dev/null || true
            echo '-- licensing-socket files over time:'
            sudo sort -u "$d/sockfiles.txt" 2>/dev/null | tail -40 || true
            echo '-- licensing-client log tail:'
            sudo tail -60 "$d/liclog.txt" 2>/dev/null || true
          done
          sudo kill "$(cat "$RUNNER_TEMP/diag-watch.pid" 2>/dev/null)" 2>/dev/null || true
          sudo pkill -f 'diag/watch.sh' 2>/dev/null || true
          mkdir -p artifacts/unity-diag
          # DIAG: strace execve lines carry the license argv — redact creds before upload
          sudo find "$RUNNER_TEMP/diag-run" -name 'strace.txt' -exec sed -i -E 's/(-serial|-username|-password)", "[^"]*/\1", "REDACTED/g' {} + 2>/dev/null || true
          sudo cp -a "$RUNNER_TEMP/diag-run" artifacts/unity-diag/diag-run 2>/dev/null || true
          sudo cp -a "$RUNNER_TEMP/diag-out" artifacts/unity-diag/diag-out 2>/dev/null || true
          sudo chmod -R a+r artifacts/unity-diag 2>/dev/null || true

      - name: Unity materialized drift check
        id: drift
        shell: pwsh
        run: |
          # BLK-018: m_currentHash of the Addressables settings is an
          # editor-derived cache field; a warm Library rewrites it on
          # save. Drop the change only when that Hash line is the sole diff.
          $aas = 'client/Assets/AddressableAssetsData/AddressableAssetSettings.asset'
          $aasDiff = git -C $env:GITHUB_WORKSPACE diff -U0 -- $aas |
            Where-Object { $_ -match '^[+-]' -and $_ -notmatch '^(\+\+\+|---) ' }
          if ($aasDiff -and -not ($aasDiff | Where-Object { $_ -notmatch '^[+-]    Hash: [0-9a-f]{32}$' })) {
            git -C $env:GITHUB_WORKSPACE checkout -- $aas
            Write-Host "derived m_currentHash reset: $aas"
          }
          $drift = git -C $env:GITHUB_WORKSPACE status --porcelain -- client/ |
            Where-Object { $_ -notmatch 'client/(Library|Temp|Logs|obj)/' }
          if ($drift) {
            $stage = 'materialized-drift'
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            foreach ($line in $drift) {
              $p = $line.Substring(3).Trim('"')
              if (Test-Path $p -PathType Leaf) {
                $dst = Join-Path $stage $p
                New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
                Copy-Item $p $dst
              }
            }
            $drift | Out-Host
            'changed=true' >> $env:GITHUB_OUTPUT
            Write-Error 'commit unity-materialized'
            exit 1
          }
          'changed=false' >> $env:GITHUB_OUTPUT

      - name: Stage cache telemetry
        # ADR-0075: the Unity job's cached-step telemetry rides on the results
        # artifact so the required job folds it into verify-report.json.
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/unity-tests
          cp "$RUNNER_TEMP/cache-telemetry.jsonl" artifacts/unity-tests/cache-telemetry.jsonl 2>/dev/null || true

      - name: Upload unity-materialized drift
        if: always() && steps.drift.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unity-materialized-linux
          path: materialized-drift/
          if-no-files-found: ignore

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unity-test-results-linux
          path: artifacts/unity-tests/
          if-no-files-found: ignore

      - name: Upload visual-review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-review
          path: artifacts/visual-review/
          if-no-files-found: ignore

      - name: Upload unity-diag (investigation-only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unity-diag-linux
          path: artifacts/unity-diag/
          if-no-files-found: ignore


  verify-linux:
    name: 'Q0-Q6 verify (Linux)'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thinhthan_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      # -- Preconditions, in order (audit_gates.md) -------------------------
      - name: Fork guard
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        shell: bash
        run: |
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ] || \
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "external PRs not accepted" >&2
            exit 1
          fi

      - name: Merge freeze guard
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$BRANCH_NAME" in
            revert/*|ops/*) echo "exempt branch"; exit 0 ;;
          esac
          if [ "${{ vars.AUTO_MERGE_FROZEN }}" = "true" ]; then
            echo "repository merge freeze active (AUTO_MERGE_FROZEN)" >&2
            exit 1
          fi

      # -- Toolchain bootstrap (pinned release assets, SHA-256 verified; the
      #    runner's preinstalled tools are never used) ---------------------
      - name: Install pwsh (pinned)
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/tools"; mkdir -p "$T"
          curl -fsSL "https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/powershell-7.6.6-linux-x64.tar.gz" -o /tmp/pwsh.tgz
          echo "ddbc4a2d113bbd46d283cfedcbcd117a70caefd7673f41f2b4e0000badf103bc  /tmp/pwsh.tgz" | sha256sum -c -
          mkdir -p "$T/pwsh" && tar -xzf /tmp/pwsh.tgz -C "$T/pwsh" && chmod +x "$T/pwsh/pwsh"
          echo "$T/pwsh" >> "$GITHUB_PATH"

      - name: Install jq / gh / git-lfs (pinned)
        shell: bash
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/tools"; mkdir -p "$T/bin"
          curl -fsSL "https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64" -o "$T/bin/jq"
          echo "b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f  $T/bin/jq" | sha256sum -c -
          chmod +x "$T/bin/jq"
          curl -fsSL "https://github.com/cli/cli/releases/download/v2.101.0/gh_2.101.0_linux_amd64.tar.gz" -o /tmp/gh.tgz
          echo "9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8  /tmp/gh.tgz" | sha256sum -c -
          tar -xzf /tmp/gh.tgz -C /tmp && cp /tmp/gh_2.101.0_linux_amd64/bin/gh "$T/bin/gh"
          curl -fsSL "https://github.com/git-lfs/git-lfs/releases/download/v3.8.0/git-lfs-linux-amd64-v3.8.0.tar.gz" -o /tmp/lfs.tgz
          echo "e455e00f15d9b95661b8d53498ffb0c3367962cf1ec73c31ab7369516cd6ab8d  /tmp/lfs.tgz" | sha256sum -c -
          tar -xzf /tmp/lfs.tgz -C /tmp && cp /tmp/git-lfs-3.8.0/git-lfs "$T/bin/git-lfs"
          echo "$T/bin" >> "$GITHUB_PATH"
          git lfs install --skip-repo || true

      - name: Install Go (pinned)
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.27.1'
          cache: false

      - name: Checkout (LFS)
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          fetch-depth: 0

      # IMP-106: explicit cache steps (policy: .devin/scripts/cache-policy.md).
      # Keys = <scope>-<os>-<pin>-<content hash>; restore-keys keep OS+pin and
      # may only roll the hash on content-addressed stores. Caches whose
      # payload derives from the hashed inputs restore on exact key only
      # (CI-001, BLK-005). Licence state is never cached (CI-002).
      - name: Cache Go modules + build (pinned)
        id: cache-go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('server/go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Install protoc + Go tool binaries (pinned)
        shell: bash
        env:
          CACHE_HIT_GO: ${{ steps.cache-go.outputs.cache-hit }}
        run: |
          set -euo pipefail
          source .devin/scripts/cache_telemetry.sh
          start=$SECONDS
          T="$RUNNER_TEMP/tools"; mkdir -p "$T/gobin" "$T/protoc"
          curl -fsSL "https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-x86_64.zip" -o /tmp/protoc.zip
          unzip -o -q /tmp/protoc.zip -d "$T/protoc"
          echo "$T/protoc/bin" >> "$GITHUB_PATH"
          GOBIN="$T/gobin" go install "google.golang.org/protobuf/cmd/protoc-gen-go@${{ env.PROTOC_GEN_GO_VERSION }}"
          GOBIN="$T/gobin" go install "honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }}"
          echo "$T/gobin" >> "$GITHUB_PATH"
          hit=miss; [ "${CACHE_HIT_GO:-}" = "true" ] && hit=hit || true
          cache_telemetry_emit go-build "$hit" "$((SECONDS-start))"

      - name: Unity scope
        id: unity-scope
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # ADR-0073: a pull_request whose diff touches no Unity-relevant path
          # skips the Unity steps; the verifier re-derives the diff and fails
          # an illegitimate skip. Pattern == gates.UnityRelevantPattern.
          $pattern = '^(client/|proto/|scripts/codegen\.|scripts/verify\.ps1$|\.github/workflows/|server/cmd/verify/|server/internal/conformance/|docs/00_context/technology_versions\.md$)'
          $run = 'true'; $scope = 'full'
          $full = $env:HEAD_REF.StartsWith('imp/IMP-068-') -or $env:HEAD_REF.EndsWith('-done')
          if ($env:EVENT_NAME -like 'pull_request*' -and -not $full) {
            $files = @(git diff --name-only "$env:BASE_SHA...$env:HEAD_SHA")
            if ($LASTEXITCODE -eq 0 -and -not ($files | Where-Object { $_ -match $pattern })) {
              $run = 'false'; $scope = 'no-client-change'
            }
          }
          Write-Host "unity scope: $scope"
          "run=$run" >> $env:GITHUB_OUTPUT
          "THINHTHAN_UNITY_SCOPE=$scope" >> $env:GITHUB_ENV

      - name: Verifier environment
        shell: bash
        run: |
          {
            echo "THINHTHAN_BASE_SHA=${{ github.event.pull_request.base.sha }}"
            echo "THINHTHAN_HEAD_SHA=${{ github.event.pull_request.head.sha }}"
            echo "THINHTHAN_RUN_ID=${{ github.run_id }}"
            echo "THINHTHAN_RUN_ATTEMPT=${{ github.run_attempt }}"
            echo "THINHTHAN_TEST_PG_DSN=postgres://postgres:postgres@localhost:5432/thinhthan_test?sslmode=disable"
          } >> "$GITHUB_ENV"

      # ADR-0077: the Unity-independent gates run while the Unity job is still
      # running; `Run Q0-Q6 verifier` adds the Unity gates to this file and
      # writes the report (a missing/unusable file makes it run every gate).
      - name: Q0-Q6 verifier (pre-Unity phase)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNITY_EDITOR_PATH: '/opt/unity/Editor/Unity'
          THINHTHAN_CACHE_HIT_GO: ${{ steps.cache-go.outputs.cache-hit }}
        run: pwsh -NoProfile -File scripts/verify.ps1 -Phase pre-unity -ReportOut "$env:RUNNER_TEMP/verify-pre-unity.json"

      - name: Wait for Unity job
        id: unity-wait
        if: steps.unity-scope.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAIT_JOB: 'Unity (Linux)'
        run: bash .devin/scripts/wait_job.sh

      - name: Download Unity test results
        if: steps.unity-scope.outputs.run == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unity-test-results-linux
          path: artifacts/unity-tests

      - name: Merge Unity cache telemetry
        if: steps.unity-scope.outputs.run == 'true'
        shell: bash
        run: |
          f=artifacts/unity-tests/cache-telemetry.jsonl
          if [ -f "$f" ]; then cat "$f" >> "$RUNNER_TEMP/cache-telemetry.jsonl"; rm -f "$f"; fi

      - name: Run Q0-Q6 verifier
        # BLK-017: always produce verify-report.json once the tree is checked out
        # (a failed Unity step is recorded as a Q3 FAIL, never a missing report).
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNITY_EDITOR_PATH: '/opt/unity/Editor/Unity'
          THINHTHAN_CACHE_HIT_GO: ${{ steps.cache-go.outputs.cache-hit }}
        run: pwsh -NoProfile -File scripts/verify.ps1 -Phase unity -PreReport "$env:RUNNER_TEMP/verify-pre-unity.json" -UnityResultsDir artifacts/unity-tests -ReportOut verify-report.json

      - name: Unity job result
        if: ${{ !cancelled() && steps.unity-scope.outputs.run == 'true' }}
        shell: bash
        env:
          CONCLUSION: ${{ steps.unity-wait.outputs.conclusion }}
        run: |
          # ADR-0075: a failed Unity job (materialization drift, licence,
          # editor crash) fails this required check even when every Unity gate
          # reports SKIP(owner-not-done).
          if [ "$CONCLUSION" != success ]; then
            echo "Unity (Linux) job concluded '$CONCLUSION' - see its log; on drift commit artifact unity-materialized-linux (agent_execution_protocol.md §4b)" >&2
            exit 1
          fi

      - name: Upload verify report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-report-linux
          path: verify-report.json
          if-no-files-found: error

      # ADR-0075: the evidence manifest is built here, not in a separate job:
      # once the Windows job has uploaded its report, both reports are merged
      # into the schema-v2 manifest (ADR-0057/0068) and uploaded as `evidence`.
      - name: Wait for Windows verify report
        id: win-wait
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAIT_JOB: 'Q0-Q6 verify (Windows)'
        run: bash .devin/scripts/wait_job.sh

      - name: Download verify report (Windows)
        if: ${{ !cancelled() && steps.win-wait.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verify-report-windows
          path: reports/windows

      - name: Build evidence manifest
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && hashFiles('reports/windows/verify-report.json', 'verify-report.json') != '' }}
        shell: pwsh
        env:
          THINHTHAN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          THINHTHAN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          THINHTHAN_RUN_ID: ${{ github.run_id }}
          THINHTHAN_RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (Test-Path reports/windows/verify-report.json) -or -not (Test-Path verify-report.json)) {
            Write-Host 'a verify report is missing - no evidence manifest (the failing job is already red)'
            exit 0
          }
          Copy-Item verify-report.json reports/linux-verify-report.json
          Move-Item reports/windows/verify-report.json reports/windows-verify-report.json
          pwsh -NoProfile -File scripts/verify.ps1 -MergeReports -MergeDir reports -TaskID "$env:HEAD_REF"

      - name: Upload evidence manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence
          path: docs/10_implementation/evidence/
          if-no-files-found: ignore

  # ADR-0075: native Unity (ADR-0073) in its own job, parallel to the
  # Go/PostgreSQL work of `Q0-Q6 verify (Windows)`, which waits for it.
  unity-windows:
    name: 'Unity (Windows)'
    if: false  # DIAG: Linux-only experiments on diag/unity-self-kill (never merged)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Fork guard
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        shell: cmd
        run: |
          if /I "${{ github.event.pull_request.head.repo.fork }}"=="true" (echo external PRs not accepted >&2 & exit /b 1)
          if /I not "${{ github.event.pull_request.head.repo.full_name }}"=="${{ github.repository }}" (echo external PRs not accepted >&2 & exit /b 1)

      - name: Merge freeze guard
        shell: cmd
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          echo %BRANCH_NAME%| findstr /b /c:"revert/" /c:"ops/" >nul && (echo exempt branch & exit /b 0)
          if /I "${{ vars.AUTO_MERGE_FROZEN }}"=="true" (echo repository merge freeze active >&2 & exit /b 1)
          exit /b 0

      # ADR-0073: pinned CLI installs are cached by their pinned version+sha
      # set; the install step re-asserts the pin marker on every run (CI-001)
      # and always runs (CI-002) — a hit only skips the downloads.
      - name: Cache pinned CLI tools
        id: cache-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\tools\cli
          key: cli-tools-${{ runner.os }}-pwsh7.6.6-jq1.8.2-gh2.101.0-lfs3.8.0-02fe458b-a6fc67fe-bc6c8143-b62e7b8c

      - name: Install pwsh + CLI tools (pinned)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $T = "$env:RUNNER_TEMP\tools\cli"; New-Item -ItemType Directory -Force -Path "$T\bin" | Out-Null
          $pins = 'pwsh7.6.6-jq1.8.2-gh2.101.0-lfs3.8.0-02fe458b-a6fc67fe-bc6c8143-b62e7b8c'
          $marker = "$T\cli.pins"
          $hit = (Test-Path $marker) -and ((Get-Content $marker -Raw).Trim() -eq $pins) `
            -and (Test-Path "$T\pwsh\pwsh.exe") -and (Test-Path "$T\bin\gh.exe") `
            -and (Test-Path "$T\bin\jq.exe") -and (Test-Path "$T\bin\git-lfs.exe")
          function Get-Pinned([string]$url, [string]$sha, [string]$out) {
            Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
            if ((Get-FileHash $out -Algorithm SHA256).Hash.ToLower() -ne $sha) {
              throw "sha256 mismatch for $url"
            }
          }
          if ($hit) {
            Write-Host 'pinned CLI tools restored from actions/cache'
          } else {
            Get-Pinned 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip' '02fe458be20493fbdf43f61ea20610b811ee6c738ab1676c61b9cfcd1a33c860' "$env:TEMP\pwsh.zip"
            Expand-Archive "$env:TEMP\pwsh.zip" -DestinationPath "$T\pwsh" -Force
            Get-Pinned 'https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-windows-amd64.exe' 'a6fc67fedaf9128a3309a1e2ebb8b986aeccf70122ee46d2cb4849e423f0c627' "$T\bin\jq.exe"
            Get-Pinned 'https://github.com/cli/cli/releases/download/v2.101.0/gh_2.101.0_windows_amd64.zip' 'bc6c814367b193cd8e713611d61e36013c0ef843b8f516458fe3eda039192794' "$env:TEMP\gh.zip"
            Expand-Archive "$env:TEMP\gh.zip" -DestinationPath "$env:TEMP\ghx" -Force
            Copy-Item "$env:TEMP\ghx\bin\gh.exe" "$T\bin\gh.exe"
            Get-Pinned 'https://github.com/git-lfs/git-lfs/releases/download/v3.8.0/git-lfs-windows-amd64-v3.8.0.zip' 'b62e7b8ceddee635f691233d77de8eaa4b213e9209e0173811d8cfa77f7882c1' "$env:TEMP\lfs.zip"
            Expand-Archive "$env:TEMP\lfs.zip" -DestinationPath "$env:TEMP\lfsx" -Force
            Copy-Item "$env:TEMP\lfsx\git-lfs-3.8.0\git-lfs.exe" "$T\bin\git-lfs.exe"
            Set-Content -Path $marker -Value $pins -NoNewline
          }
          "$T\pwsh" >> $env:GITHUB_PATH
          "$T\bin" >> $env:GITHUB_PATH
          & "$T\bin\git-lfs.exe" install --skip-repo | Out-Null

      - name: Checkout (LFS)
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          fetch-depth: 0

      # IMP-106: explicit cache steps (policy: .devin/scripts/cache-policy.md).
      # Keys = <scope>-<os>-<pin>-<content hash>; restore-keys keep OS+pin and
      # may only roll the hash on content-addressed stores. Caches whose
      # payload derives from the hashed inputs restore on exact key only
      # (CI-001, BLK-005). Licence state is never cached (CI-002).
      - name: Unity scope
        id: unity-scope
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # ADR-0073: a pull_request whose diff touches no Unity-relevant path
          # skips the Unity steps; the verifier re-derives the diff and fails
          # an illegitimate skip. Pattern == gates.UnityRelevantPattern.
          $pattern = '^(client/|proto/|scripts/codegen\.|scripts/verify\.ps1$|\.github/workflows/|server/cmd/verify/|server/internal/conformance/|docs/00_context/technology_versions\.md$)'
          $run = 'true'; $scope = 'full'
          $full = $env:HEAD_REF.StartsWith('imp/IMP-068-') -or $env:HEAD_REF.EndsWith('-done')
          if ($env:EVENT_NAME -like 'pull_request*' -and -not $full) {
            $files = @(git diff --name-only "$env:BASE_SHA...$env:HEAD_SHA")
            if ($LASTEXITCODE -eq 0 -and -not ($files | Where-Object { $_ -match $pattern })) {
              $run = 'false'; $scope = 'no-client-change'
            }
          }
          Write-Host "unity scope: $scope"
          "run=$run" >> $env:GITHUB_OUTPUT
          "THINHTHAN_UNITY_SCOPE=$scope" >> $env:GITHUB_ENV

      # ADR-0073: the Windows job runs the editor natively. The GameCI Windows
      # image (>10 GB) never fit the repository cache, so every run paid a
      # 16-17 min pull plus a failed 6-10 min cache save.
      - name: Cache Unity editor (pinned)
        id: cache-unity-editor
        if: steps.unity-scope.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\unity-editor
          key: unity-editor-${{ runner.os }}-${{ env.UNITY_WINDOWS_EDITOR_SHA256 }}

      - name: Install Unity editor (pinned)
        if: steps.unity-scope.outputs.run == 'true'
        shell: pwsh
        env:
          CACHE_HIT_EDITOR: ${{ steps.cache-unity-editor.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          . .\.devin\scripts\cache_telemetry.ps1
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $dir = "$env:RUNNER_TEMP\unity-editor"
          $exe = "$dir\Editor\Unity.exe"
          $marker = "$dir\installer.sha256"
          # A cache hit is honoured only after the marker re-asserts the pinned
          # installer sha-256 (CI-001); otherwise reinstall from the pin.
          $hit = ($env:CACHE_HIT_EDITOR -eq 'true') -and (Test-Path $exe) -and (Test-Path $marker) `
            -and ((Get-Content $marker -Raw).Trim() -eq $env:UNITY_WINDOWS_EDITOR_SHA256)
          if ($hit) {
            Write-Host 'unity editor restored from actions/cache'
          } else {
            if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
            $setup = "$env:RUNNER_TEMP\UnitySetup64.exe"
            curl.exe -fSL -m 1800 --retry 3 --retry-delay 10 $env:UNITY_WINDOWS_EDITOR_URL -o $setup
            if ($LASTEXITCODE -ne 0) { throw "unity installer download failed rc=$LASTEXITCODE" }
            if ((Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() -ne $env:UNITY_WINDOWS_EDITOR_SHA256) { throw 'unity installer sha256 mismatch' }
            # NSIS silent install: /D must be last and unquoted.
            $p = Start-Process -FilePath $setup -ArgumentList '/S', "/D=$dir" -PassThru -Wait
            if ($p.ExitCode -ne 0 -or -not (Test-Path $exe)) { throw "unity install failed rc=$($p.ExitCode)" }
            Remove-Item $setup -Force
            Set-Content -Path $marker -Value $env:UNITY_WINDOWS_EDITOR_SHA256 -NoNewline
          }
          "UNITY_EDITOR_PATH=$exe" >> $env:GITHUB_ENV
          Write-CacheTelemetry -Step 'unity-editor-image' -Result $(if ($hit) { 'hit' } else { 'miss' }) -WallSeconds $sw.Elapsed.TotalSeconds

      - name: Cache Unity client/Library (pinned)
        id: cache-unity-library
        if: steps.unity-scope.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # exact key only (CI-001): a prefix restore returns a Library built
          # from different manifest/lock/ProjectSettings inputs — a silent
          # wrong-content restore (BLK-005). A miss = cold import.
          path: client/Library
          key: unity-library-${{ runner.os }}-${{ env.UNITY_WINDOWS_EDITOR_SHA256 }}-${{ hashFiles('client/Packages/manifest.json', 'client/Packages/packages-lock.json', 'client/ProjectSettings/**', 'client/Assets/**/csc.rsp') }}

      # ADR-0077: materialization runs detached right after the Library
      # restore (it reads/writes client/Library and needs UNITY_EDITOR_PATH +
      # the licence env); the foreground's Go install, Go cache restore and
      # mode plan then overlap it. Steps in one job are sequential, so the
      # background unit is a detached pwsh process running
      # .devin/scripts/unity_materialize.ps1; completion is signalled only by
      # the exitcode.txt sentinel the join step reads.
      - name: Start Unity materialization (background)
        if: steps.unity-scope.outputs.run == 'true'
        shell: pwsh
        env:
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          CACHE_HIT_LIBRARY: ${{ steps.cache-unity-library.outputs.cache-hit }}
        run: |
          $state = "$env:RUNNER_TEMP\unity-materialize-state"
          New-Item -ItemType Directory -Force -Path $state | Out-Null
          Remove-Item "$state\exitcode.txt" -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath 'pwsh' -ArgumentList '-NoProfile', '-File', "$env:GITHUB_WORKSPACE\.devin\scripts\unity_materialize.ps1" -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput "$state\materialize.out.log" -RedirectStandardError "$state\materialize.err.log" -PassThru -NoNewWindow
          Set-Content "$state\pid.txt" -Value "$($p.Id)" -NoNewline
          Write-Host "unity materialization started in background (pid $($p.Id))"
      - name: Install Go (pinned)
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.27.1'
          cache: false

      - name: Cache Go modules + build (pinned)
        id: cache-go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/AppData/Local/go-build
          key: go-build-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('server/go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Unity mode plan
        id: unity-plan
        if: steps.unity-scope.outputs.run == 'true'
        shell: pwsh
        env:
          THINHTHAN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          THINHTHAN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          # ADR-0075: launch only the Unity test modes whose Q3 gate is active.
          $plan = go -C server run ./cmd/verify -plan-unity
          if ($LASTEXITCODE -ne 0) { throw "unity mode plan failed rc=$LASTEXITCODE" }
          $plan | Out-Host
          $plan >> $env:GITHUB_OUTPUT

      - name: Join Unity materialization
        if: steps.unity-scope.outputs.run == 'true'
        timeout-minutes: 30
        shell: pwsh
        env:
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          CACHE_HIT_LIBRARY: ${{ steps.cache-unity-library.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $state = "$env:RUNNER_TEMP\unity-materialize-state"
          $sentinel = "$state\exitcode.txt"
          $deadline = (Get-Date).AddMinutes(28)
          # ADR-0077: join the detached materialization. A missing sentinel
          # means the launcher itself failed (not a Unity failure — the script
          # always writes one), so run one synchronous materialization instead
          # of failing blind; a real rc!=0 is final, the detached run already
          # carries the full licence retry (no double retry).
          while (-not (Test-Path $sentinel) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
          }
          if (-not (Test-Path $sentinel)) {
            Write-Host 'background materialization produced no sentinel - running it in the foreground'
            pwsh -NoProfile -File "$env:GITHUB_WORKSPACE\.devin\scripts\unity_materialize.ps1"
          }
          if (Test-Path "$state\materialize.out.log") { Get-Content "$state\materialize.out.log" -Tail 80 }
          if (Test-Path "$state\materialize.err.log") { Get-Content "$state\materialize.err.log" -Tail 40 }
          if (-not (Test-Path $sentinel)) { throw 'unity materialization produced no exit code' }
          $rc = [int]((Get-Content $sentinel -Raw).Trim())
          if ($rc -ne 0) { throw "unity materialization failed rc=$rc" }
      - name: Unity EditMode+PlayMode tests
        if: steps.unity-scope.outputs.run == 'true' && steps.unity-plan.outputs.modes != ''
        timeout-minutes: 30
        shell: pwsh
        env:
          UNITY_MODES: ${{ steps.unity-plan.outputs.modes }}
        run: |
          $proj = "$env:GITHUB_WORKSPACE\client"
          $out = "$env:GITHUB_WORKSPACE\artifacts\unity-tests"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($mode in ($env:UNITY_MODES -split ' ')) {
            $xml = "$out\$mode-results.xml"
            $log = "$env:RUNNER_TEMP\unity-tests-$mode.log"
            # Retry only when Unity produced no results XML (crash/licence/
            # infra); a results file — pass or fail — is final and judged by
            # the verifier (Q3).
            foreach ($i in 1..3) {
              Remove-Item $xml, $log -Force -ErrorAction SilentlyContinue
              $uargs = @('-batchmode', '-nographics', '-projectPath', $proj, '-runTests', '-testPlatform', $mode, '-testResults', $xml, '-logFile', $log)
              $p = Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList $uargs -PassThru -Wait -NoNewWindow
              if (Test-Path $log) { Get-Content $log -Tail 80 }
              if (Test-Path $xml) { Write-Host "unity $mode tests finished (rc=$($p.ExitCode))"; break }
              Write-Host "unity $mode attempt $i produced no results (rc=$($p.ExitCode)); retrying after 20s"
              Start-Sleep -Seconds 20
            }
            if (-not (Test-Path $xml)) { Write-Error "unity $mode tests produced no results after 3 attempts"; exit 1 }
          }

      - name: Return Unity licence
        if: always() && steps.unity-scope.outputs.run == 'true'
        shell: pwsh
        env:
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        run: |
          if (-not $env:UNITY_EDITOR_PATH -or -not (Test-Path 'C:\ProgramData\Unity\Unity_lic.ulf')) { Write-Host 'no activated licence to return'; exit 0 }
          # Bounded: the editor lingers ~10 min after the return request on
          # hosted runners; the runner VM is discarded anyway.
          $p = Start-Process -FilePath $env:UNITY_EDITOR_PATH -ArgumentList @('-batchmode', '-nographics', '-quit', '-returnlicense', '-username', "$env:UNITY_EMAIL", '-password', "$env:UNITY_PASSWORD", '-logFile', "$env:RUNNER_TEMP\unity-return.log") -PassThru -NoNewWindow
          if ($p.WaitForExit(90000)) { Write-Host "licence return rc=$($p.ExitCode)" }
          else {
            Get-Content "$env:RUNNER_TEMP\unity-return.log" -Tail 20 -ErrorAction SilentlyContinue
            $p | Stop-Process -Force -ErrorAction SilentlyContinue
            Write-Host 'licence return still running after 90s - stopped'
          }
          exit 0

      - name: Unity materialized drift check
        id: drift
        shell: pwsh
        run: |
          # BLK-018: m_currentHash of the Addressables settings is an
          # editor-derived cache field; a warm Library rewrites it on
          # save. Drop the change only when that Hash line is the sole diff.
          $aas = 'client/Assets/AddressableAssetsData/AddressableAssetSettings.asset'
          $aasDiff = git -C $env:GITHUB_WORKSPACE diff -U0 -- $aas |
            Where-Object { $_ -match '^[+-]' -and $_ -notmatch '^(\+\+\+|---) ' }
          if ($aasDiff -and -not ($aasDiff | Where-Object { $_ -notmatch '^[+-]    Hash: [0-9a-f]{32}$' })) {
            git -C $env:GITHUB_WORKSPACE checkout -- $aas
            Write-Host "derived m_currentHash reset: $aas"
          }
          $drift = git -C $env:GITHUB_WORKSPACE status --porcelain -- client/ |
            Where-Object { $_ -notmatch 'client/(Library|Temp|Logs|obj)/' }
          if ($drift) {
            $stage = 'materialized-drift'
            New-Item -ItemType Directory -Force -Path $stage | Out-Null
            foreach ($line in $drift) {
              $p = $line.Substring(3).Trim('"')
              if (Test-Path $p -PathType Leaf) {
                $dst = Join-Path $stage $p
                New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
                Copy-Item $p $dst
              }
            }
            $drift | Out-Host
            'changed=true' >> $env:GITHUB_OUTPUT
            Write-Error 'commit unity-materialized'
            exit 1
          }
          'changed=false' >> $env:GITHUB_OUTPUT

      - name: Stage cache telemetry
        # ADR-0075: the Unity job's cached-step telemetry rides on the results
        # artifact so the required job folds it into verify-report.json.
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/unity-tests | Out-Null
          $t = Join-Path $env:RUNNER_TEMP 'cache-telemetry.jsonl'
          if (Test-Path $t) { Copy-Item $t artifacts/unity-tests/cache-telemetry.jsonl }

      - name: Upload unity-materialized drift
        if: always() && steps.drift.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unity-materialized-windows
          path: materialized-drift/
          if-no-files-found: ignore

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unity-test-results-windows
          path: artifacts/unity-tests/
          if-no-files-found: ignore


  verify-windows:
    if: false  # DIAG: Linux-only experiments on diag/unity-self-kill (never merged)
    name: 'Q0-Q6 verify (Windows)'
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Fork guard
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        shell: cmd
        run: |
          if /I "${{ github.event.pull_request.head.repo.fork }}"=="true" (echo external PRs not accepted >&2 & exit /b 1)
          if /I not "${{ github.event.pull_request.head.repo.full_name }}"=="${{ github.repository }}" (echo external PRs not accepted >&2 & exit /b 1)

      - name: Merge freeze guard
        shell: cmd
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          echo %BRANCH_NAME%| findstr /b /c:"revert/" /c:"ops/" >nul && (echo exempt branch & exit /b 0)
          if /I "${{ vars.AUTO_MERGE_FROZEN }}"=="true" (echo repository merge freeze active >&2 & exit /b 1)
          exit /b 0

      # ADR-0073: pinned CLI installs are cached by their pinned version+sha
      # set; the install step re-asserts the pin marker on every run (CI-001)
      # and always runs (CI-002) — a hit only skips the downloads.
      - name: Cache pinned CLI tools
        id: cache-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\tools\cli
          key: cli-tools-${{ runner.os }}-pwsh7.6.6-jq1.8.2-gh2.101.0-lfs3.8.0-02fe458b-a6fc67fe-bc6c8143-b62e7b8c

      - name: Install pwsh + CLI tools (pinned)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $T = "$env:RUNNER_TEMP\tools\cli"; New-Item -ItemType Directory -Force -Path "$T\bin" | Out-Null
          $pins = 'pwsh7.6.6-jq1.8.2-gh2.101.0-lfs3.8.0-02fe458b-a6fc67fe-bc6c8143-b62e7b8c'
          $marker = "$T\cli.pins"
          $hit = (Test-Path $marker) -and ((Get-Content $marker -Raw).Trim() -eq $pins) `
            -and (Test-Path "$T\pwsh\pwsh.exe") -and (Test-Path "$T\bin\gh.exe") `
            -and (Test-Path "$T\bin\jq.exe") -and (Test-Path "$T\bin\git-lfs.exe")
          function Get-Pinned([string]$url, [string]$sha, [string]$out) {
            Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
            if ((Get-FileHash $out -Algorithm SHA256).Hash.ToLower() -ne $sha) {
              throw "sha256 mismatch for $url"
            }
          }
          if ($hit) {
            Write-Host 'pinned CLI tools restored from actions/cache'
          } else {
            Get-Pinned 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.6/PowerShell-7.6.6-win-x64.zip' '02fe458be20493fbdf43f61ea20610b811ee6c738ab1676c61b9cfcd1a33c860' "$env:TEMP\pwsh.zip"
            Expand-Archive "$env:TEMP\pwsh.zip" -DestinationPath "$T\pwsh" -Force
            Get-Pinned 'https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-windows-amd64.exe' 'a6fc67fedaf9128a3309a1e2ebb8b986aeccf70122ee46d2cb4849e423f0c627' "$T\bin\jq.exe"
            Get-Pinned 'https://github.com/cli/cli/releases/download/v2.101.0/gh_2.101.0_windows_amd64.zip' 'bc6c814367b193cd8e713611d61e36013c0ef843b8f516458fe3eda039192794' "$env:TEMP\gh.zip"
            Expand-Archive "$env:TEMP\gh.zip" -DestinationPath "$env:TEMP\ghx" -Force
            Copy-Item "$env:TEMP\ghx\bin\gh.exe" "$T\bin\gh.exe"
            Get-Pinned 'https://github.com/git-lfs/git-lfs/releases/download/v3.8.0/git-lfs-windows-amd64-v3.8.0.zip' 'b62e7b8ceddee635f691233d77de8eaa4b213e9209e0173811d8cfa77f7882c1' "$env:TEMP\lfs.zip"
            Expand-Archive "$env:TEMP\lfs.zip" -DestinationPath "$env:TEMP\lfsx" -Force
            Copy-Item "$env:TEMP\lfsx\git-lfs-3.8.0\git-lfs.exe" "$T\bin\git-lfs.exe"
            Set-Content -Path $marker -Value $pins -NoNewline
          }
          "$T\pwsh" >> $env:GITHUB_PATH
          "$T\bin" >> $env:GITHUB_PATH
          & "$T\bin\git-lfs.exe" install --skip-repo | Out-Null

      - name: Install Go (pinned)
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.27.1'
          cache: false

      - name: Checkout (LFS)
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          fetch-depth: 0

      # IMP-106: explicit cache steps (policy: .devin/scripts/cache-policy.md).
      # Keys = <scope>-<os>-<pin>-<content hash>; restore-keys keep OS+pin and
      # may only roll the hash on content-addressed stores. Caches whose
      # payload derives from the hashed inputs restore on exact key only
      # (CI-001, BLK-005). Licence state is never cached (CI-002).
      - name: Cache Go modules + build (pinned)
        id: cache-go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/AppData/Local/go-build
          key: go-build-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('server/go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Install protoc + Go tool binaries (pinned)
        shell: pwsh
        env:
          CACHE_HIT_GO: ${{ steps.cache-go.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          . .\.devin\scripts\cache_telemetry.ps1
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $T = "$env:RUNNER_TEMP\tools"
          New-Item -ItemType Directory -Force -Path "$T\gobin","$T\protoc" | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-win64.zip' -OutFile "$env:TEMP\protoc.zip" -UseBasicParsing
          Expand-Archive "$env:TEMP\protoc.zip" -DestinationPath "$T\protoc" -Force
          $env:GOBIN = "$T\gobin"
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${{ env.PROTOC_GEN_GO_VERSION }}"
          go install "honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }}"
          "$T\protoc\bin" >> $env:GITHUB_PATH
          "$T\gobin" >> $env:GITHUB_PATH
          Write-CacheTelemetry -Step 'go-build' -Result $(if ($env:CACHE_HIT_GO -eq 'true') { 'hit' } else { 'miss' }) -WallSeconds $sw.Elapsed.TotalSeconds

      - name: Cache PostgreSQL EDB binaries (pinned)
        id: cache-edb
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\edb-cache
          key: edb-${{ runner.os }}-18.6-${{ env.EDB_ZIP_SHA256 }}

      - name: PostgreSQL test server (EDB pinned)
        shell: pwsh
        env:
          CACHE_HIT_EDB: ${{ steps.cache-edb.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          . .\.devin\scripts\cache_telemetry.ps1
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $edbSha = $env:EDB_ZIP_SHA256
          $cacheRoot = "$env:RUNNER_TEMP\edb-cache"
          $marker = "$cacheRoot\edb.sha256"
          $bin = "$cacheRoot\pgsql\bin"
          # A cache hit is only honoured after the marker re-asserts the pinned
          # sha-256 — a poisoned entry degrades to the download path (CI-001).
          $hit = ($env:CACHE_HIT_EDB -eq 'true') -and (Test-Path $marker) `
            -and ((Get-Content $marker -Raw).Trim() -eq $edbSha) -and (Test-Path "$bin\initdb.exe")
          if ($hit) {
            Write-Host 'edb binaries restored from actions/cache'
          } else {
            $z = "$env:RUNNER_TEMP\edb.zip"
            curl.exe -fSL -m 900 --retry 3 --retry-delay 10 'https://get.enterprisedb.com/postgresql/postgresql-18.6-1-windows-x64-binaries.zip' -o $z
            if ($LASTEXITCODE -ne 0) { throw "edb download failed rc=$LASTEXITCODE" }
            Write-Host 'edb download done'
            if ((Get-FileHash $z -Algorithm SHA256).Hash.ToLower() -ne $edbSha) { throw 'edb sha256 mismatch' }
            Write-Host 'edb sha256 ok'
            New-Item -ItemType Directory -Force -Path $cacheRoot | Out-Null
            tar.exe -xf $z -C $cacheRoot
            if (-not (Test-Path "$bin\initdb.exe")) { $bin = "$cacheRoot\bin" }
            Set-Content -Path $marker -Value $edbSha -NoNewline
            Write-Host "edb extract done; bin=$bin"
          }
          Write-CacheTelemetry -Step 'edb-postgres' -Result $(if ($hit) { 'hit' } else { 'miss' }) -WallSeconds $sw.Elapsed.TotalSeconds
          $p = Start-Process -FilePath "$bin\initdb.exe" -ArgumentList "-D `"$env:RUNNER_TEMP\pgdata`" -U postgres -A trust -E UTF8 --locale=C" -NoNewWindow -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\initdb.out" -RedirectStandardError "$env:RUNNER_TEMP\initdb.err"
          if (-not $p.WaitForExit(300000)) { $p | Stop-Process -Force; throw 'initdb timed out after 300s' }
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\initdb.err" -Tail 40 -ErrorAction SilentlyContinue; throw "initdb failed rc=$($p.ExitCode)" }
          Write-Host 'initdb done'
          $l = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $l.Start(); $port = $l.LocalEndpoint.Port; $l.Stop()
          $p = Start-Process -FilePath "$bin\pg_ctl.exe" -ArgumentList "-D `"$env:RUNNER_TEMP\pgdata`" -o `"-p $port`" -l `"$env:RUNNER_TEMP\pg.log`" -w -t 120 start" -NoNewWindow -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\pgctl.out" -RedirectStandardError "$env:RUNNER_TEMP\pgctl.err"
          if (-not $p.WaitForExit(180000)) { $p | Stop-Process -Force; Get-Content "$env:RUNNER_TEMP\pg.log" -Tail 40 -ErrorAction SilentlyContinue; throw 'pg_ctl timed out after 180s' }
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\pg.log" -Tail 40 -ErrorAction SilentlyContinue; throw "pg_ctl failed rc=$($p.ExitCode)" }
          Write-Host 'postgres started'
          "THINHTHAN_TEST_PG_DSN=postgres://postgres@127.0.0.1:$port/postgres?sslmode=disable" >> $env:GITHUB_ENV

      - name: Verifier environment
        shell: pwsh
        run: |
          @(
            "THINHTHAN_BASE_SHA=${{ github.event.pull_request.base.sha }}",
            "THINHTHAN_HEAD_SHA=${{ github.event.pull_request.head.sha }}",
            "THINHTHAN_RUN_ID=${{ github.run_id }}",
            "THINHTHAN_RUN_ATTEMPT=${{ github.run_attempt }}"
          ) -join "`n" >> $env:GITHUB_ENV

      - name: Unity scope
        id: unity-scope
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # ADR-0073: a pull_request whose diff touches no Unity-relevant path
          # skips the Unity steps; the verifier re-derives the diff and fails
          # an illegitimate skip. Pattern == gates.UnityRelevantPattern.
          $pattern = '^(client/|proto/|scripts/codegen\.|scripts/verify\.ps1$|\.github/workflows/|server/cmd/verify/|server/internal/conformance/|docs/00_context/technology_versions\.md$)'
          $run = 'true'; $scope = 'full'
          $full = $env:HEAD_REF.StartsWith('imp/IMP-068-') -or $env:HEAD_REF.EndsWith('-done')
          if ($env:EVENT_NAME -like 'pull_request*' -and -not $full) {
            $files = @(git diff --name-only "$env:BASE_SHA...$env:HEAD_SHA")
            if ($LASTEXITCODE -eq 0 -and -not ($files | Where-Object { $_ -match $pattern })) {
              $run = 'false'; $scope = 'no-client-change'
            }
          }
          Write-Host "unity scope: $scope"
          "run=$run" >> $env:GITHUB_OUTPUT
          "THINHTHAN_UNITY_SCOPE=$scope" >> $env:GITHUB_ENV

      # ADR-0073: the Windows job runs the editor natively. The GameCI Windows
      # image (>10 GB) never fit the repository cache, so every run paid a
      # 16-17 min pull plus a failed 6-10 min cache save.
      - name: Unity editor path
        shell: pwsh
        # The Unity job installs the pinned editor here (ADR-0073); the
        # verifier's Q1 records the pinned path.
        run: '"UNITY_EDITOR_PATH=$env:RUNNER_TEMP\unity-editor\Editor\Unity.exe" >> $env:GITHUB_ENV'

      # ADR-0077: the Unity-independent gates run while the Unity job is still
      # running; `Run Q0-Q6 verifier` adds the Unity gates to this file and
      # writes the report (a missing/unusable file makes it run every gate).
      - name: Q0-Q6 verifier (pre-Unity phase)
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THINHTHAN_CACHE_HIT_GO: ${{ steps.cache-go.outputs.cache-hit }}
        run: pwsh -NoProfile -File scripts/verify.ps1 -Phase pre-unity -ReportOut "$env:RUNNER_TEMP/verify-pre-unity.json"

      - name: Wait for Unity job
        id: unity-wait
        if: steps.unity-scope.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAIT_JOB: 'Unity (Windows)'
        run: bash .devin/scripts/wait_job.sh

      - name: Download Unity test results
        if: steps.unity-scope.outputs.run == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unity-test-results-windows
          path: artifacts/unity-tests

      - name: Merge Unity cache telemetry
        if: steps.unity-scope.outputs.run == 'true'
        shell: pwsh
        run: |
          $f = 'artifacts/unity-tests/cache-telemetry.jsonl'
          if (Test-Path $f) {
            Get-Content $f | Add-Content (Join-Path $env:RUNNER_TEMP 'cache-telemetry.jsonl')
            Remove-Item $f
          }

      - name: Run Q0-Q6 verifier
        # BLK-017: always produce verify-report.json once the tree is checked out
        # (a failed Unity step is recorded as a Q3 FAIL, never a missing report).
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THINHTHAN_CACHE_HIT_GO: ${{ steps.cache-go.outputs.cache-hit }}
        run: pwsh -NoProfile -File scripts/verify.ps1 -Phase unity -PreReport "$env:RUNNER_TEMP/verify-pre-unity.json" -UnityResultsDir artifacts/unity-tests -ReportOut verify-report.json

      - name: Unity job result
        if: ${{ !cancelled() && steps.unity-scope.outputs.run == 'true' }}
        shell: bash
        env:
          CONCLUSION: ${{ steps.unity-wait.outputs.conclusion }}
        run: |
          # ADR-0075: a failed Unity job (materialization drift, licence,
          # editor crash) fails this required check even when every Unity gate
          # reports SKIP(owner-not-done).
          if [ "$CONCLUSION" != success ]; then
            echo "Unity (Windows) job concluded '$CONCLUSION' - see its log; on drift commit artifact unity-materialized-windows (agent_execution_protocol.md §4b)" >&2
            exit 1
          fi

      - name: Upload verify report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-report-windows
          path: verify-report.json
          if-no-files-found: error

