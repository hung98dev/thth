          "run=$run" >> $env:GITHUB_OUTPUT
          "THINHTHAN_UNITY_SCOPE=$scope" >> $env:GITHUB_ENV

      # ADR-0073: the Windows job runs the editor natively. The GameCI Windows
      # image (>10 GB) never fit the repository cache, so every run paid a
      # 16-17 min pull plus a failed 6-10 min cache save.
      - name: Unity mode plan
        id: unity-plan
        if: steps.unity-scope.outputs.run == 'true'
        shell: pwsh
        env:
          THINHTHAN_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          THINHTHAN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          # ADR-0075: launch only the Unity test modes whose Q3 gate is active.
          $plan = go -C server run ./cmd/verify -plan-unity
          if ($LASTEXITCODE -ne 0) { throw "unity mode plan failed rc=$LASTEXITCODE" }
          $plan | Out-Host
          $plan >> $env:GITHUB_OUTPUT

      - name: Cache Unity editor (pinned)
        id: cache-unity-editor
        if: steps.unity-scope.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\unity-editor
          key: unity-editor-${{ runner.os }}-${{ env.UNITY_WINDOWS_EDITOR_SHA256 }}

      - name: Install Unity editor (pinned)
        if: steps.unity-scope.outputs.run == 'true'
        shell: pwsh
        env:
          CACHE_HIT_EDITOR: ${{ steps.cache-unity-editor.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          . .\.devin\scripts\cache_telemetry.ps1
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $dir = "$env:RUNNER_TEMP\unity-editor"
          $exe = "$dir\Editor\Unity.exe"
          $marker = "$dir\installer.sha256"
